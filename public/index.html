<!doctype html>
<html lang="ko">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#f4f1ec"
>

<title>유작 · 예매 현황</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Pretendard:wght@400;500;600;700;800&display=swap');


:root{

  --bg:#f3f0eb;

  --paper:#fffdf9;

  --ink:#27231f;

  --muted:#817b73;

  --line:#e5e0d8;

  --soft:#f7f4ef;

  --shadow:
    0 18px 55px rgba(37,31,25,.08);

}


*{
  box-sizing:border-box;
}


html{
  background:var(--bg);
}


body{

  margin:0;

  color:var(--ink);

  font-family:
    Pretendard,
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    sans-serif;

  -webkit-font-smoothing:antialiased;

}


.wrap{

  width:min(
    920px,
    calc(100% - 24px)
  );

  margin:auto;

  padding:
    18px
    0
    60px;

}


.topbar{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:
    0
    3px
    14px;

  color:#77716a;

  font-size:10px;

}


.brand{

  font:
    600 22px/1
    "Noto Serif KR",
    serif;

  letter-spacing:-.13em;

}


.date{

  letter-spacing:.08em;

}


.card{

  background:
    rgba(255,253,249,.97);

  border:
    1px solid rgba(50,45,40,.07);

  border-radius:24px;

  box-shadow:var(--shadow);

}


/* 포스터 */

.posterStage{

  position:relative;

  padding:
    8px
    0
    16px;

  display:flex;

  justify-content:center;

  align-items:center;

  min-height:300px;

  margin-bottom:10px;

  overflow:hidden;

  border-radius:30px;

  background:

    radial-gradient(
      circle at 18% 25%,
      rgba(255,255,255,.95) 0 2px,
      transparent 3px
    ),

    radial-gradient(
      circle at 82% 70%,
      rgba(255,255,255,.9) 0 2px,
      transparent 3px
    ),

    linear-gradient(
      135deg,
      #eee9e2,
      #f8f5ef 48%,
      #ebe5dc
    );

  box-shadow:var(--shadow);

}


.poster{

  width:min(
    620px,
    78%
  );

  overflow:hidden;

  border-radius:24px;

  position:relative;

  z-index:2;

}


.poster img{

  display:block;

  width:100%;

  height:auto;

}


.deco{

  position:absolute;

  color:#b8afa4;

  z-index:1;

  pointer-events:none;

}


.decoA{

  left:9%;

  top:18%;

  font-size:34px;

  opacity:.55;

}


.decoB{

  right:8%;

  top:25%;

  font-size:17px;

  letter-spacing:8px;

  opacity:.5;

}


.decoC{

  left:7%;

  bottom:16%;

  font-size:9px;

  letter-spacing:.28em;

  writing-mode:vertical-rl;

  opacity:.65;

}


/* 검색 */

.search{

  padding:24px;

}


.eyebrow{

  font-size:9px;

  font-weight:800;

  letter-spacing:.2em;

  color:#9a938b;

}


.title{

  font:
    600 24px/1.35
    "Noto Serif KR",
    serif;

  letter-spacing:-.07em;

  margin:
    7px
    0
    6px;

}


.desc{

  font-size:11px;

  color:var(--muted);

  line-height:1.7;

  margin-bottom:15px;

}


.searchTabs{

  display:flex;

  gap:6px;

  margin-bottom:10px;

}


.searchTab{

  flex:1;

  height:40px;

  border:
    1px solid
    var(--line);

  border-radius:12px;

  background:#f7f4ef;

  color:#8c857d;

  font-size:11px;

  font-weight:800;

  cursor:pointer;

}


.searchTab.active{

  background:#292724;

  color:#fff;

  border-color:#292724;

}


.row{

  display:flex;

  gap:8px;

}


.input{

  height:52px;

  flex:1;

  min-width:0;

  border:
    1px solid
    #ddd7cf;

  border-radius:15px;

  padding:
    0
    16px;

  background:#fbf9f5;

  outline:0;

  font-size:14px;

}


.input:focus{

  background:#fff;

  border-color:#9b9389;

  box-shadow:
    0 0 0 4px #f0ece6;

}


.btn{

  height:52px;

  border:0;

  border-radius:15px;

  background:#292724;

  color:#fff;

  font-size:12px;

  font-weight:800;

  padding:
    0
    23px;

  cursor:pointer;

}


.btn:disabled{
  opacity:.5;
}


.meta{

  margin-top:8px;

  color:#aaa39b;

  font-size:9px;

}


.error{

  min-height:16px;

  color:#a33a32;

  font-size:10px;

  margin-top:6px;

}


.privacy{

  text-align:center;

  color:#9a938b;

  font-size:9px;

  line-height:1.7;

  margin:
    11px
    5px;

}


/* 지인 미선택 */

.otherLink{

  display:flex;

  align-items:center;

  justify-content:space-between;

  width:100%;

  margin-top:10px;

  padding:
    15px
    16px;

  border:
    1px solid
    var(--line);

  border-radius:17px;

  background:#fffdf9;

  color:var(--ink);

  cursor:pointer;

  text-align:left;

  box-shadow:
    0 8px 25px
    rgba(37,31,25,.04);

}


.otherText{

  display:flex;

  flex-direction:column;

  gap:4px;

}


.otherLink strong{
  font-size:12px;
}


.otherLink span{
  font-size:9px;
  color:var(--muted);
}


.otherLink .arrow{

  font-size:18px;

  color:#9a938b;

}


/* 통계 */

.stats{

  display:grid;

  grid-template-columns:
    1fr
    1fr
    1.4fr;

  gap:10px;

  margin-top:14px;

}


.stat{

  padding:18px;

}


.label{

  font-size:9px;

  color:#8b847c;

  margin-bottom:6px;

}


.value{

  font:
    600 23px
    "Noto Serif KR",
    serif;

}


.value small{

  font:
    11px
    Pretendard,
    sans-serif;

  color:#77716a;

}


.update{

  font-size:10px;

  color:#77716a;

  line-height:1.6;

}


.update strong{

  display:block;

  color:var(--ink);

  font-size:11px;

}


/* 회차 */

.episodeGrid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  margin-top:10px;

}


.episode{

  padding:
    15px
    16px;

}


.episodeTop{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:7px;

}


.episodeNo{

  font-size:9px;

  font-weight:800;

  letter-spacing:.12em;

  color:#9a938b;

}


.episodePeople{

  font:
    600 22px
    "Noto Serif KR",
    serif;

}


.episodePeople small{

  font:
    11px
    Pretendard,
    sans-serif;

  color:#77716a;

}


.episodeDate{

  font-size:9px;

  color:#77716a;

}


.episodeBookings{

  font-size:9px;

  color:#aaa39b;

  margin-top:4px;

}


/* 지인 미선택 결과 */

.otherResult{

  margin-top:22px;

  padding:22px;

}


.otherHeader{

  display:flex;

  justify-content:space-between;

  align-items:end;

  border-bottom:
    1px solid
    var(--line);

  padding:
    0
    2px
    16px;

}


.otherTitle{

  font:
    600 21px
    "Noto Serif KR",
    serif;

  letter-spacing:-.06em;

}


.otherSummary{

  text-align:right;

  font-size:10px;

  color:#77716a;

  line-height:1.6;

}


.otherSummary strong{

  font:
    600 19px
    "Noto Serif KR",
    serif;

  color:var(--ink);

}


.otherRow{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:
    14px
    4px;

  border-bottom:
    1px solid
    #f0ede8;

}


.otherRow:last-child{
  border-bottom:0;
}


.otherName{

  font-size:12px;

  font-weight:700;

}


.otherMeta{

  font-size:10px;

  color:#77716a;

  text-align:right;

}


.otherSlot{

  display:block;

  font-size:9px;

  color:#aaa39b;

  margin-top:3px;

}


/* 검색 결과 */

.result{

  margin-top:22px;

  padding:22px;

}


.resultTop{

  display:flex;

  justify-content:space-between;

  align-items:end;

  border-bottom:
    1px solid
    var(--line);

  padding:
    0
    2px
    16px;

}


.resultName{

  font:
    600 22px
    "Noto Serif KR",
    serif;

  letter-spacing:-.06em;

}


.summary{

  text-align:right;

  font-size:10px;

  color:#77716a;

  line-height:1.6;

}


.summary strong{

  font:
    600 19px
    "Noto Serif KR",
    serif;

  color:var(--ink);

}


.day{

  padding-top:20px;

}


.day h2{

  font:
    600 16px
    "Noto Serif KR",
    serif;

  margin:
    0
    0
    9px;

}


.time{

  overflow:hidden;

  border:
    1px solid
    var(--line);

  border-radius:17px;

  background:#fff;

  margin:
    8px
    0;

}


.timeHead{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:
    13px
    15px;

  background:var(--soft);

  border-bottom:
    1px solid
    var(--line);

}


.timeLabel{

  font-size:13px;

  font-weight:800;

}


.timeMeta{

  font-size:9px;

  color:#858079;

}


.person{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:
    12px
    15px;

  border-bottom:
    1px solid
    #f0ede8;

}


.person:last-child{
  border-bottom:0;
}


.personName{

  font-size:12px;

  font-weight:700;

}


.personCount{

  font-size:10px;

  color:#77716b;

}


/* 귀여운 비교 버튼 */

.cuteCompareBtn{

  width:100%;

  display:flex;

  align-items:center;

  gap:13px;

  margin-top:14px;

  padding:
    14px
    16px;

  border:
    1px solid
    #e2dcd4;

  border-radius:19px;

  background:
    linear-gradient(
      135deg,
      #fffdf9,
      #f8f3ed
    );

  color:var(--ink);

  cursor:pointer;

  text-align:left;

  box-shadow:
    0 10px 28px
    rgba(37,31,25,.05);

  transition:
    all .18s ease;

}


.cuteCompareBtn:hover{

  transform:
    translateY(-2px);

  box-shadow:
    0 14px 34px
    rgba(37,31,25,.09);

}


.cuteCompareBtn:disabled{

  opacity:.6;

  cursor:wait;

}


.cuteIcon{

  width:42px;

  height:42px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:14px;

  background:#eee8df;

  font-size:22px;

  flex-shrink:0;

}


.cuteText{

  display:flex;

  flex-direction:column;

  gap:4px;

  flex:1;

}


.cuteText strong{

  font-size:12px;

}


.cuteText span{

  color:#8a837b;

  font-size:9px;

}


.cuteArrow{

  font-size:17px;

  color:#9a938b;

}


/* 비교 결과 */

.compareBox{

  display:none;

  margin-top:14px;

  padding:22px;

}


.cardHeading{

  border-bottom:
    1px solid
    var(--line);

  padding-bottom:16px;

  margin-bottom:16px;

}


.cardTitle{

  font:
    600 21px
    "Noto Serif KR",
    serif;

  letter-spacing:-.06em;

}


.cardSub{

  margin-top:5px;

  font-size:10px;

  color:#77716a;

}


.compareGrid{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:10px;

}


.compareSide{

  border:
    1px solid
    var(--line);

  border-radius:18px;

  background:#fff;

  padding:17px;

}


.compareSide b{

  font-size:11px;

}


.compareNum{

  font:
    600 29px
    "Noto Serif KR",
    serif;

  margin:
    10px
    0
    6px;

}


.compareNames{

  font-size:10px;

  color:#77716a;

  line-height:1.8;

}


.compareBoth{

  margin-top:10px;

  padding:
    14px
    16px;

  border-radius:15px;

  background:var(--soft);

  font-size:10px;

  color:#77716a;

  line-height:1.8;

}


.compareBoth strong{
  color:var(--ink);
}


.compareNote{

  margin-top:12px;

  font-size:9px;

  line-height:1.7;

  color:#aaa39b;

}


.empty{

  text-align:center;

  padding:46px 10px;

  color:#777;

  font-size:12px;

}


.back{

  border:0;

  background:transparent;

  color:#777;

  font-size:11px;

  font-weight:800;

  padding:0;

  margin:
    0
    0
    13px;

  cursor:pointer;

}


footer{

  text-align:center;

  color:#aaa39b;

  font-size:9px;

  margin-top:18px;

}


/* 모바일 */

@media(max-width:650px){

  .wrap{

    width:
      calc(100% - 14px);

    padding-top:10px;

  }


  .topbar{

    padding-bottom:10px;

  }


  .posterStage{

    min-height:240px;

    border-radius:24px;

  }


  .poster{

    width:84%;

    border-radius:20px;

  }


  .decoA{

    left:4%;

    top:16%;

  }


  .decoB{

    right:3%;

    top:22%;

  }


  .decoC{

    left:4%;

    bottom:13%;

  }


  .search{

    padding:19px;

  }


  .title{

    font-size:21px;

  }


  .stats{

    grid-template-columns:
      1fr
      1fr;

  }


  .stat:last-child{

    grid-column:
      1 / -1;

  }


  .stat{

    padding:15px;

  }


  .value{

    font-size:21px;

  }


  .result{

    padding:
      17px
      13px;

    border-radius:21px;

  }


  .resultTop{

    align-items:flex-start;

    flex-direction:column;

    gap:5px;

  }


  .summary{

    text-align:left;

  }


  .row .btn{

    padding:
      0
      18px;

  }


  .episodeGrid{

    grid-template-columns:
      1fr
      1fr;

  }


  .episode{

    padding:14px;

  }


  .compareGrid{

    grid-template-columns:
      1fr;

  }


  .otherHeader{

    align-items:flex-start;

    flex-direction:column;

    gap:8px;

  }


  .otherSummary{

    text-align:left;

  }

}

</style>

</head>


<body>


<main class="wrap">


<!-- 상단 -->

<div class="topbar">

  <div class="brand">
    유작
  </div>

  <div class="date">
    2026 · RESERVATION
  </div>

</div>


<!-- 포스터 -->

<div class="posterStage">

  <div class="deco decoA">
    ✦
  </div>

  <div class="deco decoB">
    · · ·
  </div>

  <div class="deco decoC">
    YUJAK
  </div>

  <div class="poster">

    <img
      src="/poster.png"
      alt="유작 공연 포스터"
    >

  </div>

</div>


<section id="home">


<!-- 검색 -->

<div class="card search">

  <div class="eyebrow">
    RESERVATION CHECK
  </div>


  <h1
    id="pageTitle"
    class="title"
  >
    배우 이름을 입력하세요
  </h1>


  <div
    id="pageDesc"
    class="desc"
  >
    배우 이름을 입력하면 해당 배우의 예매 현황을 날짜와 시간별로 확인할 수 있습니다.
  </div>


  <!-- 검색 타입 -->

  <div class="searchTabs">

    <button
      class="searchTab active"
      data-type="friend"
      type="button"
    >
      배우 이름
    </button>


    <button
      class="searchTab"
      data-type="booker"
      type="button"
    >
      예매자 성함
    </button>

  </div>


  <div class="row">

    <input
      id="nameInput"
      class="input"
      placeholder="배우 이름을 입력하세요"
      autocomplete="off"
      maxlength="50"
    >


    <button
      id="searchBtn"
      class="btn"
      type="button"
    >
      확인
    </button>

  </div>


  <div
    id="status"
    class="meta"
  >
    엑셀 데이터 확인 중…
  </div>


  <div
    id="error"
    class="error"
  ></div>

</div>


<div class="privacy">

  예매자 성함은 그대로 표시되며,
  연락처는 공개하지 않습니다.

</div>


<!-- 지인 미선택 -->

<button
  id="otherBtn"
  class="otherLink"
  type="button"
>

  <span class="otherText">

    <strong>
      지인 미선택 명단 보기
    </strong>

    <span id="otherBtnSub">
      지인을 선택하지 않은 예매자를 확인합니다.
    </span>

  </span>

  <span class="arrow">
    ›
  </span>

</button>


<!-- 전체 통계 -->

<div class="stats">


  <div class="card stat">

    <div class="label">
      전체 예매 건수
    </div>

    <div
      id="allBookings"
      class="value"
    >
      — <small>건</small>
    </div>

  </div>


  <div class="card stat">

    <div class="label">
      전체 예매 인원
    </div>

    <div
      id="allPeople"
      class="value"
    >
      — <small>명</small>
    </div>

  </div>


  <div class="card stat">

    <div class="label">
      데이터 기준
    </div>

    <div class="update">

      <strong id="allUpdated">
        확인 중…
      </strong>

      엑셀 마지막 응답 기준

    </div>

  </div>


</div>


<!-- 회차 -->

<div
  id="episodes"
  class="episodeGrid"
></div>


<!-- 귀여운 비교 버튼 -->

<button
  id="compareBtn"
  class="cuteCompareBtn"
  type="button"
>

  <div class="cuteIcon">
    🐹
  </div>


  <div class="cuteText">

    <strong>
      누가 바닐라에서 더 잘했는가
    </strong>

    <span>
      김명훈 🆚 정우영 · 공연 예매 현황 비교
    </span>

  </div>


  <div class="cuteArrow">
    ✨
  </div>

</button>


<!-- 닫기 버튼 -->

<button
  id="compareCloseBtn"
  class="cuteCompareBtn"
  type="button"
  style="display:none"
>

  <div class="cuteIcon">
    🐹
  </div>


  <div class="cuteText">

    <strong>
      비교 결과 닫기
    </strong>

    <span>
      다시 메인 화면으로 돌아가기
    </span>

  </div>


  <div class="cuteArrow">
    ✕
  </div>

</button>


<!-- 비교 결과 -->

<div
  id="compareBox"
  class="card compareBox"
></div>


</section>


<!-- 지인 미선택 결과 -->

<section
  id="otherResult"
  style="display:none"
>

  <button
    id="otherBackBtn"
    class="back"
    type="button"
  >
    ← 다시 보기
  </button>


  <div class="card otherResult">


    <div class="otherHeader">

      <div class="otherTitle">
        지인 미선택 명단
      </div>


      <div
        id="otherSummary"
        class="otherSummary"
      ></div>

    </div>


    <div
      id="otherGroups"
    ></div>


  </div>


  <footer
    id="otherUpdated"
  ></footer>

</section>


<!-- 검색 결과 -->

<section
  id="result"
  style="display:none"
>

  <button
    id="backBtn"
    class="back"
    type="button"
  >
    ← 다시 검색
  </button>


  <div class="card result">


    <div class="resultTop">

      <div
        id="resultName"
        class="resultName"
      ></div>


      <div
        id="summary"
        class="summary"
      ></div>

    </div>


    <div
      id="groups"
    ></div>


  </div>


  <footer
    id="resultUpdated"
  ></footer>

</section>


</main>


<script>


const $ =
  selector =>
    document.querySelector(selector);


let searchType =
  'friend';


/* 날짜 표시 */

const fmt =
  value => {

    if(!value){
      return '-';
    }

    const date =
      new Date(value);

    if(
      Number.isNaN(
        date.getTime()
      )
    ){
      return value;
    }

    return new Intl.DateTimeFormat(
      'ko-KR',
      {
        year:'numeric',
        month:'numeric',
        day:'numeric',
        hour:'2-digit',
        minute:'2-digit',
        hour12:false,
        timeZone:'Asia/Seoul'
      }
    ).format(date);

  };


/* HTML escape */

const esc =
  value => {

    return String(
      value ?? ''
    ).replace(
      /[&<>"']/g,
      char => ({

        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'

      }[char])
    );

  };


/* 검색 탭 */

document
  .querySelectorAll('.searchTab')
  .forEach(tab => {

    tab.onclick = () => {

      document
        .querySelectorAll('.searchTab')
        .forEach(item =>
          item.classList.remove('active')
        );

      tab.classList.add('active');

      searchType =
        tab.dataset.type;


      if(
        searchType === 'booker'
      ){

        $('#pageTitle')
          .textContent =
            '예매자 성함을 입력하세요';

        $('#pageDesc')
          .textContent =
            '예매자 성함으로 검색하면 해당 예매자의 실제 예매 내역을 확인할 수 있습니다.';

        $('#nameInput')
          .placeholder =
            '예매자 성함을 입력하세요';

      }else{

        $('#pageTitle')
          .textContent =
            '배우 이름을 입력하세요';

        $('#pageDesc')
          .textContent =
            '배우 이름을 입력하면 해당 배우의 예매 현황을 날짜와 시간별로 확인할 수 있습니다.';

        $('#nameInput')
          .placeholder =
            '배우 이름을 입력하세요';

      }


      $('#nameInput').focus();

    };

  });


/* 전체 현황 */

async function status(){

  try{

    const response =
      await fetch('/api/status');

    const data =
      await response.json();

    if(!response.ok){
      throw new Error(
        data.error
      );
    }


    $('#allBookings')
      .innerHTML =
        data.reservationCount +
        ' <small>건</small>';


    $('#allPeople')
      .innerHTML =
        data.totalPeople +
        ' <small>명</small>';


    $('#allUpdated')
      .textContent =
        fmt(
          data.latestResponse
        );


    $('#status')
      .textContent =
        '엑셀 마지막 응답: ' +
        fmt(data.latestResponse) +
        ' (KST)';


    renderEpisodes(
      data.episodes || []
    );

  }catch(error){

    console.error(error);

    $('#status')
      .textContent =
        '데이터를 불러오지 못했습니다.';

  }

}


/* 회차 */

function renderEpisodes(
  episodes
){

  const element =
    $('#episodes');


  if(!episodes.length){

    element.innerHTML = '';

    return;
  }


  element.innerHTML =
    episodes
      .slice(0, 6)
      .map(episode => `

        <div class="card episode">

          <div class="episodeTop">

            <span class="episodeNo">
              EPISODE ${esc(episode.episode)}
            </span>

            <span class="episodeDate">
              ${esc(episode.label)}
            </span>

          </div>


          <div class="episodePeople">

            ${episode.people}

            <small>
              명
            </small>

          </div>


          <div class="episodeBookings">

            예매 ${episode.bookings}건

          </div>

        </div>

      `)
      .join('');

}


/* 지인 미선택 */

async function loadOther(){

  try{

    const response =
      await fetch('/api/other');

    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        '명단을 불러오지 못했습니다.'
      );

    }


    $('#otherBtnSub')
      .textContent =
        `지인을 선택하지 않은 예매자 ${data.total}건 · ${data.totalPeople}명`;


    $('#otherSummary')
      .innerHTML =
        `<strong>${data.totalPeople}명</strong><br>총 ${data.total}건`;


    const rows =
      data.reservations
        .map(item => {

          const slots =
            (item.slots || [])
              .map(slot =>
                `${slot.month}월 ${slot.day}일 ${slot.label}`
              )
              .join(' · ');


          return `

            <div class="otherRow">

              <div>

                <div class="otherName">
                  ${esc(item.name)}
                </div>

                <span class="otherSlot">
                  ${esc(slots)}
                </span>

              </div>


              <div class="otherMeta">
                ${item.count}명
              </div>

            </div>

          `;

        })
        .join('');


    $('#otherGroups')
      .innerHTML =
        rows ||
        '<div class="empty">지인 미선택 예매자가 없습니다.</div>';


    $('#otherUpdated')
      .textContent =
        '엑셀 마지막 응답 · ' +
        fmt(data.latestResponse) +
        ' (KST)';


  }catch(error){

    console.error(error);

    $('#otherGroups')
      .innerHTML =
        '<div class="empty">명단을 불러오지 못했습니다.</div>';

  }

}


/* 미선택 화면 */

function showOther(){

  $('#home').style.display =
    'none';

  $('#result').style.display =
    'none';

  $('#otherResult').style.display =
    'block';


  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}


/* 미선택 화면 닫기 */

function hideOther(){

  $('#otherResult').style.display =
    'none';

  $('#home').style.display =
    'block';


  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}


/* 검색 */

async function search(){

  const name =
    $('#nameInput')
      .value
      .trim();


  $('#error').textContent = '';


  if(!name){

    $('#error')
      .textContent =
        searchType === 'booker'
          ? '예매자 성함을 입력해주세요.'
          : '배우 이름을 입력해주세요.';

    return;
  }


  const button =
    $('#searchBtn');


  button.disabled = true;

  button.textContent =
    '조회 중';


  try{

    const response =
      await fetch(
        '/api/search?type=' +
        encodeURIComponent(searchType) +
        '&name=' +
        encodeURIComponent(name)
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        '조회에 실패했습니다.'
      );

    }


    render(data);


  }catch(error){

    console.error(error);

    $('#error')
      .textContent =
        error.message;


  }finally{

    button.disabled = false;

    button.textContent =
      '확인';

  }

}


/* 검색 결과 */

function render(data){

  $('#home').style.display =
    'none';

  $('#otherResult').style.display =
    'none';

  $('#result').style.display =
    'block';


  $('#resultName')
    .textContent =

      searchType === 'booker'
        ? data.name + '님 예매 현황'
        : data.name + ' 관련 예매 현황';


  $('#summary')
    .innerHTML =

      '<strong>' +
      data.totalPeople +
      '명</strong><br>총 ' +
      data.totalBookings +
      '건';


  const days =
    new Map();


  for(
    const reservation
    of data.reservations
  ){

    for(
      const slot
      of reservation.slots
    ){

      const key =
        slot.month +
        '-' +
        slot.day;


      if(!days.has(key)){

        days.set(
          key,
          {
            month:slot.month,
            day:slot.day,
            times:new Map()
          }
        );

      }


      const day =
        days.get(key);


      if(
        !day.times.has(
          slot.key
        )
      ){

        day.times.set(
          slot.key,
          {
            label:slot.label,
            minutes:
              slot.hour * 60 +
              slot.minute,
            rows:[]
          }
        );

      }


      const time =
        day.times.get(
          slot.key
        );


      if(
        !time.rows.some(
          item =>
            item.id ===
            reservation.id
        )
      ){

        time.rows.push(
          reservation
        );

      }

    }

  }


  let html = '';


  for(
    const day
    of [...days.values()]
      .sort(
        (a,b) =>
          a.month - b.month ||
          a.day - b.day
      )
  ){

    html +=
      `<section class="day">
        <h2>
          ${day.month}월 ${day.day}일
        </h2>`;


    for(
      const time
      of [...day.times.values()]
        .sort(
          (a,b) =>
            a.minutes -
            b.minutes
        )
    ){

      const people =
        time.rows.reduce(
          (sum,reservation) =>
            sum + reservation.count,
          0
        );


      html += `

        <div class="time">

          <div class="timeHead">

            <span class="timeLabel">
              ${esc(time.label)}
            </span>

            <span class="timeMeta">
              ${time.rows.length}건 · ${people}명
            </span>

          </div>


          ${time.rows
            .map(reservation => `

              <div class="person">

                <span class="personName">
                  ${esc(reservation.name)}
                </span>

                <span class="personCount">
                  ${reservation.count}명
                </span>

              </div>

            `)
            .join('')}

        </div>

      `;

    }


    html +=
      '</section>';

  }


  $('#groups')
    .innerHTML =
      html ||
      '<div class="empty">해당 예매 내역이 없습니다.</div>';


  $('#resultUpdated')
    .textContent =
      '엑셀 마지막 응답 · ' +
      fmt(data.latestResponse) +
      ' (KST)';

}


/* 바닐라 비교 */

async function comparePerformances(){

  const box =
    $('#compareBox');

  const button =
    $('#compareBtn');


  button.disabled = true;


  try{

    const response =
      await fetch(
        '/api/compare-performances'
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        '집계에 실패했습니다.'
      );

    }


    const lunchNames =
      data.lunch.names
        .map(
          person =>
            esc(person.name) +
            ' ' +
            person.count +
            '명'
        )
        .join(', ') ||
      '없음';


    const dinnerNames =
      data.dinner.names
        .map(
          person =>
            esc(person.name) +
            ' ' +
            person.count +
            '명'
        )
        .join(', ') ||
      '없음';


    const both =
      data.both
        .map(
          name =>
            esc(name)
        )
        .join(', ') ||
      '없음';


    box.innerHTML = `

      <div class="cardHeading">

        <div class="cardTitle">
          누가 바닐라에서 더 잘했는가
        </div>

        <div class="cardSub">
          김명훈 🆚 정우영
        </div>

      </div>


      <div class="compareGrid">


        <div class="compareSide">

          <b>
            ☀️ 정우영 · 점심 공연 3회
          </b>

          <div class="compareNum">
            ${data.lunch.people}명
          </div>

          <div class="compareNames">
            ${lunchNames}
          </div>

        </div>


        <div class="compareSide">

          <b>
            🌙 김명훈 · 저녁 공연 3회
          </b>

          <div class="compareNum">
            ${data.dinner.people}명
          </div>

          <div class="compareNames">
            ${dinnerNames}
          </div>

        </div>


      </div>


      <div class="compareBoth">

        <strong>
          🔄 점심 + 저녁 모두 예매
        </strong>

        <br>

        ${both}

      </div>


      <div class="compareNote">

        지정된 20명의 예매자를 기준으로
        실제 예매한 날짜와 시간을 확인합니다.
        지인 선택 값은 이 비교에 사용하지 않습니다.

      </div>

    `;


    box.style.display =
      'block';


    button.style.display =
      'none';


    $('#compareCloseBtn')
      .style.display =
        'flex';


    setTimeout(() => {

      box.scrollIntoView({
        behavior:'smooth',
        block:'start'
      });

    },50);


  }catch(error){

    console.error(error);

    box.innerHTML =
      `<div class="empty">
        ${esc(error.message)}
      </div>`;

    box.style.display =
      'block';

  }finally{

    button.disabled = false;

  }

}


/* 비교 닫기 */

function closeCompare(){

  $('#compareBox')
    .style.display =
      'none';


  $('#compareCloseBtn')
    .style.display =
      'none';


  $('#compareBtn')
    .style.display =
      'flex';

}


/* 검색 버튼 */

$('#searchBtn').onclick =
  search;


/* 엔터 검색 */

$('#nameInput').onkeydown =
  event => {

    if(event.key === 'Enter'){
      search();
    }

  };


/* 검색 결과 뒤로가기 */

$('#backBtn').onclick =
  () => {

    $('#result')
      .style.display =
        'none';

    $('#home')
      .style.display =
        'block';

    $('#nameInput').focus();

  };


/* 미선택 */

$('#otherBtn').onclick =
  showOther;


$('#otherBackBtn').onclick =
  hideOther;


/* 비교 */

$('#compareBtn').onclick =
  comparePerformances;


$('#compareCloseBtn').onclick =
  closeCompare;


/* 최초 실행 */

status();

loadOther();

</script>

</body>

</html>
