<!doctype html>
<html lang="ko">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<meta
  name="theme-color"
  content="#f5f1eb"
>

<title>유작 · 예매 현황</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Pretendard:wght@400;500;600;700;800&display=swap');

:root{

  --bg:#f4f0e9;
  --paper:#fffdfa;
  --paper2:#faf7f2;

  --ink:#29241f;
  --muted:#827a71;
  --light:#a69d93;

  --line:#e6dfd5;

  --dark:#2b2723;

  --shadow:
    0 16px 45px rgba(48,39,30,.07);

}

*{
  box-sizing:border-box;
}

html{
  background:var(--bg);
}

body{

  margin:0;

  color:var(--ink);

  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(255,255,255,.8),
      transparent 35%
    ),
    var(--bg);

  font-family:
    Pretendard,
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    sans-serif;

  -webkit-font-smoothing:antialiased;

}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.wrap{

  width:
    min(1180px, calc(100% - 30px));

  margin:auto;

  padding:
    18px
    0
    70px;

}

/* =========================
   Header
========================= */

.header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    4px
    4px
    15px;

}

.logo{

  font:
    600 25px/1
    "Noto Serif KR",
    serif;

  letter-spacing:-.12em;

}

.headerRight{

  color:var(--muted);

  font-size:9px;

  letter-spacing:.13em;

}

/* =========================
   HERO
========================= */

.hero{

  position:relative;

  overflow:hidden;

  display:grid;

  grid-template-columns:
    42% 58%;

  min-height:430px;

  border-radius:28px;

  background:#ddd5ca;

  box-shadow:var(--shadow);

}

/* 포스터 */

.heroPoster{

  position:relative;

  min-height:430px;

  overflow:hidden;

  background:#eee8df;

}

.heroPoster img{

  display:block;

  width:100%;

  height:100%;

  object-fit:cover;

}

/* 단체사진 */

.heroPhoto{

  position:relative;

  min-height:430px;

  overflow:hidden;

  background:#292722;

}

.heroPhoto img{

  display:block;

  width:100%;

  height:100%;

  object-fit:cover;

}

/* 가운데 자연스러운 연결 */

.heroPhoto::before{

  content:"";

  position:absolute;

  z-index:2;

  left:0;
  top:0;
  bottom:0;

  width:90px;

  background:
    linear-gradient(
      90deg,
      #eee8df 0%,
      rgba(238,232,223,.75) 25%,
      rgba(238,232,223,0) 100%
    );

  pointer-events:none;

}

/* hero 하단 캡션 */

.heroCaption{

  position:absolute;

  z-index:4;

  left:25px;

  bottom:22px;

  color:white;

  font-size:9px;

  letter-spacing:.15em;

  text-shadow:
    0 1px 8px rgba(0,0,0,.5);

}

/* =========================
   MAIN GRID
========================= */

.mainGrid{

  display:grid;

  grid-template-columns:
    1.45fr
    1.25fr
    .62fr;

  gap:12px;

  margin-top:13px;

}

/* =========================
   CARD
========================= */

.card{

  background:
    rgba(255,253,250,.96);

  border:
    1px solid
    rgba(62,51,40,.07);

  border-radius:22px;

  box-shadow:var(--shadow);

}

/* =========================
   SEARCH
========================= */

.searchCard{

  padding:23px;

}

.eyebrow{

  color:#a0988e;

  font-size:8px;

  font-weight:800;

  letter-spacing:.2em;

}

.searchTitle{

  margin:
    7px
    0
    4px;

  font:
    600 21px/1.35
    "Noto Serif KR",
    serif;

  letter-spacing:-.08em;

}

.searchDesc{

  color:var(--muted);

  font-size:10px;

  line-height:1.7;

  margin-bottom:14px;

}

/* 검색 종류 */

.searchTabs{

  display:flex;

  gap:6px;

  margin-bottom:9px;

}

.searchTab{

  border:
    1px solid
    var(--line);

  background:
    #faf7f2;

  color:#938b82;

  border-radius:999px;

  padding:
    7px
    11px;

  font-size:9px;

  font-weight:800;

}

.searchTab.active{

  background:var(--dark);

  color:white;

  border-color:var(--dark);

}

.searchRow{

  display:flex;

  gap:7px;

}

.searchInput{

  min-width:0;

  flex:1;

  height:49px;

  border:
    1px solid
    #ded7ce;

  background:#fcfaf7;

  border-radius:14px;

  padding:
    0
    14px;

  outline:none;

  font-size:12px;

}

.searchInput:focus{

  border-color:#aaa096;

  background:white;

  box-shadow:
    0 0 0 4px
    rgba(180,168,154,.13);

}

.searchButton{

  height:49px;

  padding:
    0
    19px;

  border:0;

  border-radius:14px;

  background:var(--dark);

  color:white;

  font-size:10px;

  font-weight:800;

}

.searchButton:disabled{

  opacity:.5;

}

/* 추천 검색 */

.quick{

  display:flex;

  align-items:center;

  gap:6px;

  flex-wrap:wrap;

  margin-top:11px;

}

.quickLabel{

  color:#999188;

  font-size:8px;

  margin-right:2px;

}

.quickBtn{

  border:0;

  background:#f3eee7;

  color:#71695f;

  padding:
    6px
    9px;

  border-radius:999px;

  font-size:8px;

}

/* =========================
   STATS
========================= */

.statsCard{

  padding:20px;

}

.cardHeading{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:12px;

}

.cardTitle{

  font:
    600 18px
    "Noto Serif KR",
    serif;

  letter-spacing:-.07em;

}

.cardSub{

  color:#a19a91;

  font-size:8px;

}

.statsGrid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

}

.statBox{

  min-height:100px;

  padding:14px;

  border:
    1px solid
    #e8e1d8;

  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      #fffdfa,
      #faf6f0
    );

}

.statLabel{

  color:#938a81;

  font-size:8px;

  margin-bottom:9px;

}

.statValue{

  font:
    500 28px
    "Noto Serif KR",
    serif;

  letter-spacing:-.08em;

}

.statValue small{

  font:
    10px
    Pretendard,
    sans-serif;

  color:#777067;

}

.statDate{

  font-size:9px;

  line-height:1.5;

  color:#777067;

}

/* =========================
   SIDE ACTIONS
========================= */

.actionsCard{

  padding:11px;

}

.action{

  display:flex;

  align-items:center;

  justify-content:space-between;

  width:100%;

  min-height:60px;

  padding:
    0
    13px;

  border:
    1px solid
    #e2dbd2;

  border-radius:15px;

  background:#fcfaf7;

  color:var(--ink);

  text-align:left;

  margin-bottom:7px;

}

.action:last-child{
  margin-bottom:0;
}

.action:hover{
  background:white;
}

.actionIcon{

  width:27px;

  height:27px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:#f0ebe4;

  margin-right:9px;

}

.actionLeft{

  display:flex;

  align-items:center;

  min-width:0;

}

.actionText strong{

  display:block;

  font-size:10px;

  margin-bottom:2px;

}

.actionText span{

  display:block;

  color:#999188;

  font-size:7px;

}

.arrow{

  color:#938b82;

  font-size:14px;

}

.actionNote{

  padding:
    9px
    6px
    3px;

  color:#9c948b;

  font-size:8px;

  line-height:1.6;

}

/* =========================
   COMPARE
========================= */

.compareBox{

  display:none;

  margin-top:10px;

  padding:18px;

}

.compareGrid{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:8px;

}

.compareSide{

  border:
    1px solid
    var(--line);

  background:#faf7f2;

  border-radius:15px;

  padding:14px;

}

.compareSide b{

  display:block;

  color:#938b82;

  font-size:8px;

  margin-bottom:5px;

}

.compareNum{

  font:
    500 25px
    "Noto Serif KR",
    serif;

}

.compareNames{

  margin-top:7px;

  color:#777067;

  font-size:9px;

  line-height:1.7;

}

.compareBoth{

  margin-top:9px;

  padding-top:9px;

  border-top:1px solid var(--line);

  color:#777067;

  font-size:8px;

  line-height:1.7;

}

.compareNote{

  margin-top:8px;

  color:#aaa198;

  font-size:7px;

  line-height:1.6;

}

/* =========================
   EPISODES
========================= */

.episodeSection{

  margin-top:13px;

  padding:21px;

}

.episodeHeader{

  display:flex;

  justify-content:space-between;

  align-items:end;

  margin-bottom:13px;

}

.episodeTitle{

  font:
    600 19px
    "Noto Serif KR",
    serif;

  letter-spacing:-.07em;

}

.episodeDesc{

  color:#999188;

  font-size:8px;

}

.episodeGrid{

  display:grid;

  grid-template-columns:
    repeat(6,1fr);

  gap:8px;

}

.episode{

  min-height:140px;

  padding:13px;

  border:
    1px solid
    #e7e0d7;

  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      #fffdfa,
      #faf6f0
    );

}

.episodeNo{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  width:22px;

  height:22px;

  border-radius:50%;

  background:#eee8df;

  color:#776f65;

  font-size:8px;

  font-weight:800;

}

.episodeTime{

  margin-top:13px;

  font:
    500 14px
    "Noto Serif KR",
    serif;

}

.episodeDate{

  margin-top:3px;

  color:#8b837a;

  font-size:8px;

}

.episodePeople{

  display:flex;

  gap:6px;

  margin-top:17px;

  color:#4d4740;

  font-size:9px;

}

.episodeBookings{

  margin-top:5px;

  color:#999188;

  font-size:8px;

}

/* =========================
   RESULT
========================= */

.resultPage{
  display:none;
}

.back{

  border:0;

  background:transparent;

  color:#777067;

  padding:0;

  margin:
    0
    0
    11px;

  font-size:9px;

  font-weight:800;

}

.resultCard{

  padding:22px;

}

.resultTop{

  display:flex;

  justify-content:space-between;

  align-items:end;

  padding-bottom:15px;

  border-bottom:
    1px solid
    var(--line);

}

.resultName{

  font:
    600 22px
    "Noto Serif KR",
    serif;

  letter-spacing:-.08em;

}

.summary{

  color:#777067;

  text-align:right;

  font-size:9px;

  line-height:1.5;

}

.summary strong{

  color:var(--ink);

  font:
    500 21px
    "Noto Serif KR",
    serif;

}

.day{

  padding-top:19px;

}

.day h2{

  margin:
    0
    0
    8px;

  font:
    600 15px
    "Noto Serif KR",
    serif;

}

.time{

  overflow:hidden;

  border:
    1px solid
    var(--line);

  border-radius:15px;

  background:white;

  margin:
    7px
    0;

}

.timeHead{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:
    12px
    14px;

  background:#faf7f2;

  border-bottom:
    1px solid
    var(--line);

}

.timeLabel{

  font-size:11px;

  font-weight:800;

}

.timeMeta{

  color:#898178;

  font-size:8px;

}

.person{

  display:flex;

  justify-content:space-between;

  padding:
    11px
    14px;

  border-bottom:
    1px solid
    #f1eee9;

}

.person:last-child{
  border-bottom:0;
}

.personName{

  font-size:10px;

  font-weight:700;

}

.personCount{

  color:#777067;

  font-size:9px;

}

.empty{

  padding:45px 10px;

  color:#888078;

  text-align:center;

  font-size:10px;

}

.error{

  color:#a53b34;

  min-height:14px;

  margin-top:6px;

  font-size:8px;

}

.status{

  margin-top:7px;

  color:#a39a91;

  font-size:7px;

}

/* =========================
   FOOTER
========================= */

.footer{

  margin-top:17px;

  color:#a69d93;

  text-align:center;

  font-size:8px;

}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .mainGrid{

    grid-template-columns:
      1fr
      1fr;

  }

  .actionsCard{

    grid-column:
      1 / -1;

    display:grid;

    grid-template-columns:
      1fr 1fr;

    gap:7px;

  }

  .action{

    margin:0;

  }

  .actionNote{

    grid-column:
      1 / -1;

  }

  .episodeGrid{

    grid-template-columns:
      repeat(3,1fr);

  }

}

@media(max-width:650px){

  .wrap{

    width:
      calc(100% - 16px);

    padding-top:9px;

  }

  .hero{

    grid-template-columns:
      1fr;

    min-height:auto;

  }

  .heroPoster{

    height:350px;

    min-height:0;

  }

  .heroPhoto{

    height:300px;

    min-height:0;

  }

  .heroPhoto::before{

    left:0;
    top:0;
    right:0;
    bottom:auto;

    width:auto;
    height:70px;

    background:
      linear-gradient(
        180deg,
        #eee8df,
        transparent
      );

  }

  .mainGrid{

    grid-template-columns:1fr;

  }

  .actionsCard{

    grid-template-columns:1fr;

  }

  .statsGrid{

    grid-template-columns:
      1fr
      1fr;

  }

  .statBox:last-child{

    grid-column:
      1 / -1;

  }

  .episodeGrid{

    grid-template-columns:
      1fr 1fr;

  }

  .episodeSection{

    padding:17px;

  }

  .episodeHeader{

    align-items:flex-start;

    flex-direction:column;

    gap:4px;

  }

  .searchRow{

    flex-direction:column;

  }

  .searchButton{

    width:100%;

  }

  .compareGrid{

    grid-template-columns:1fr;

  }

  .resultTop{

    align-items:flex-start;

    flex-direction:column;

    gap:6px;

  }

  .summary{

    text-align:left;

  }

}

</style>

</head>

<body>

<div class="wrap">

  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">

    <div class="logo">
      유작
    </div>

    <div class="headerRight">
      2026 · RESERVATION
    </div>

  </header>


  <!-- =========================
       HERO
  ========================== -->

  <section class="hero">

    <div class="heroPoster">

      <img
        src="/poster.png"
        alt="유작 포스터"
      >

    </div>

    <div class="heroPhoto">

      <img
        src="/cast.jpg"
        alt="유작 배우 단체사진"
      >

      <div class="heroCaption">
        CAST · 2026
      </div>

    </div>

  </section>


  <!-- =========================
       HOME
  ========================== -->

  <section id="home">

    <div class="mainGrid">


      <!-- 검색 -->

      <div class="card searchCard">

        <div class="eyebrow">
          RESERVATION CHECK
        </div>

        <h1 class="searchTitle">
          배우 / 예매자 검색
        </h1>

        <div class="searchDesc">
          배우 이름 또는 예매자 성함을 입력하면
          예매 현황을 확인할 수 있습니다.
        </div>


        <div class="searchTabs">

          <button
            class="searchTab active"
            data-type="friend"
          >
            배우 이름
          </button>

          <button
            class="searchTab"
            data-type="booker"
          >
            예매자 성함
          </button>

        </div>


        <div class="searchRow">

          <input
            id="nameInput"
            class="searchInput"
            type="text"
            placeholder="배우 이름을 입력하세요"
            autocomplete="off"
            maxlength="50"
          >

          <button
            id="searchBtn"
            class="searchButton"
          >
            검색
          </button>

        </div>


        <div
          id="error"
          class="error"
        ></div>

        <div
          id="status"
          class="status"
        >
          데이터 확인 중…
        </div>


        <div class="quick">

          <span class="quickLabel">
            인기 검색어
          </span>

          <button
            class="quickBtn"
            data-name="정우영"
          >
            정우영
          </button>

          <button
            class="quickBtn"
            data-name="김명훈"
          >
            김명훈
          </button>

          <button
            class="quickBtn"
            data-name="박경희"
          >
            박경희
          </button>

          <button
            class="quickBtn"
            data-name="이희성"
          >
            이희성
          </button>

          <button
            class="quickBtn"
            data-name="서태원"
          >
            서태원
          </button>

        </div>

      </div>


      <!-- 전체 통계 -->

      <div class="card statsCard">

        <div class="cardHeading">

          <div class="cardTitle">
            전체 예매 현황
          </div>

          <div class="cardSub">
            마지막 업데이트
            <span id="updateTime">
              확인 중
            </span>
          </div>

        </div>


        <div class="statsGrid">


          <div class="statBox">

            <div class="statLabel">
              전체 예매 건수
            </div>

            <div
              id="allBookings"
              class="statValue"
            >
              -
              <small>건</small>
            </div>

          </div>


          <div class="statBox">

            <div class="statLabel">
              전체 예매 인원
            </div>

            <div
              id="allPeople"
              class="statValue"
            >
              -
              <small>명</small>
            </div>

          </div>


          <div class="statBox">

            <div class="statLabel">
              데이터 기준
            </div>

            <div
              id="dataDate"
              class="statDate"
            >
              확인 중…
            </div>

          </div>


        </div>

      </div>


      <!-- 액션 -->

      <div class="card actionsCard">

        <button
          id="compareBtn"
          class="action"
        >

          <div class="actionLeft">

            <div class="actionIcon">
              ◌
            </div>

            <div class="actionText">

              <strong>
                점심 · 저녁 공연 비교
              </strong>

              <span>
                지정 20명 공연별 확인
              </span>

            </div>

          </div>

          <div class="arrow">
            ›
          </div>

        </button>


        <button
          id="compareCloseBtn"
          class="action"
          style="display:none"
        >

          <div class="actionLeft">

            <div class="actionIcon">
              ×
            </div>

            <div class="actionText">

              <strong>
                비교 결과 닫기
              </strong>

              <span>
                메인 화면으로 돌아가기
              </span>

            </div>

          </div>

          <div class="arrow">
            ‹
          </div>

        </button>


        <div class="actionNote">

          지인 선택을 하지 않은 예매자도
          전체 인원 및 회차별 현황에 포함됩니다.

        </div>

      </div>

    </div>


    <!-- 비교 결과 -->

    <div
      id="compareBox"
      class="card compareBox"
    ></div>


    <!-- =========================
         EPISODES
    ========================== -->

    <section class="card episodeSection">

      <div class="episodeHeader">

        <div class="episodeTitle">
          회차별 예매 현황
        </div>

        <div class="episodeDesc">
          예매된 회차별 인원과 건수를 확인할 수 있습니다.
        </div>

      </div>


      <div
        id="episodes"
        class="episodeGrid"
      ></div>

    </section>


    <div class="footer">
      YUJAK · RESERVATION SYSTEM
    </div>

  </section>


  <!-- =========================
       RESULT
  ========================== -->

  <section
    id="result"
    class="resultPage"
  >

    <button
      id="backBtn"
      class="back"
    >
      ← 다시 검색
    </button>


    <div class="card resultCard">

      <div class="resultTop">

        <div
          id="resultName"
          class="resultName"
        ></div>

        <div
          id="summary"
          class="summary"
        ></div>

      </div>


      <div id="groups"></div>

    </div>


    <div
      id="resultUpdated"
      class="footer"
    ></div>

  </section>

</div>


<script>

/* =========================
   상태
========================= */

let searchType =
  'friend';


/* =========================
   DOM
========================= */

const $ =
  selector =>
    document.querySelector(
      selector
    );


/* =========================
   Escape
========================= */

function esc(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      char => ({

        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'

      }[char])
    );

}


/* =========================
   날짜 포맷
========================= */

function fmt(value){

  if(!value){
    return '-';
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return value;
  }

  return new Intl.DateTimeFormat(
    'ko-KR',
    {
      year:'numeric',
      month:'2-digit',
      day:'2-digit',
      hour:'2-digit',
      minute:'2-digit',
      hour12:false,
      timeZone:'Asia/Seoul'
    }
  ).format(date);

}


/* =========================
   검색 방식 변경
========================= */

document
  .querySelectorAll(
    '.searchTab'
  )
  .forEach(button => {

    button.addEventListener(
      'click',
      () => {

        document
          .querySelectorAll(
            '.searchTab'
          )
          .forEach(
            b =>
              b.classList.remove(
                'active'
              )
          );

        button.classList.add(
          'active'
        );

        searchType =
          button.dataset.type;

        $('#nameInput').value =
          '';

        $('#error').textContent =
          '';

        $('#nameInput').placeholder =
          searchType === 'friend'
            ? '배우 이름을 입력하세요'
            : '예매자 성함을 입력하세요';

      }
    );

  });


/* =========================
   전체 상태
========================= */

async function loadStatus(){

  try{

    const response =
      await fetch(
        '/api/status'
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error
      );

    }


    $('#allBookings').innerHTML =
      data.reservationCount +
      ' <small>건</small>';


    $('#allPeople').innerHTML =
      data.totalPeople +
      ' <small>명</small>';


    $('#updateTime').textContent =
      fmt(
        data.latestResponse
      );


    $('#dataDate').textContent =
      fmt(
        data.latestResponse
      ) +
      ' 기준';


    $('#status').textContent =
      '엑셀 마지막 응답 · ' +
      fmt(
        data.latestResponse
      );


    renderEpisodes(
      data.episodes || []
    );

  }catch(error){

    console.error(error);

    $('#status').textContent =
      '데이터를 불러오지 못했습니다.';

  }

}


/* =========================
   회차 렌더링
========================= */

function renderEpisodes(
  episodes
){

  const element =
    $('#episodes');

  if(!episodes.length){

    element.innerHTML =
      '<div class="empty">' +
      '등록된 공연 회차가 없습니다.' +
      '</div>';

    return;

  }


  element.innerHTML =
    episodes
      .map(
        episode => `

          <div class="episode">

            <div class="episodeNo">
              ${episode.episode}
            </div>

            <div class="episodeTime">
              ${esc(
                episode.label
                  .split(' ')[2] ||
                episode.label
              )}
            </div>

            <div class="episodeDate">
              ${episode.month}월
              ${episode.day}일
            </div>

            <div class="episodePeople">
              ◯
              ${episode.people}명
            </div>

            <div class="episodeBookings">
              ▤
              ${episode.bookings}건
            </div>

          </div>

        `
      )
      .join('');

}


/* =========================
   검색
========================= */

async function search(
  forcedName = null
){

  const input =
    $('#nameInput');

  const name =
    forcedName !== null
      ? forcedName.trim()
      : input.value.trim();

  $('#error').textContent =
    '';

  if(!name){

    $('#error').textContent =
      searchType === 'friend'
        ? '배우 이름을 입력해주세요.'
        : '예매자 성함을 입력해주세요.';

    return;

  }


  const button =
    $('#searchBtn');

  button.disabled = true;

  button.textContent =
    '조회 중';


  try{

    const response =
      await fetch(
        '/api/search?type=' +
        encodeURIComponent(
          searchType
        ) +
        '&name=' +
        encodeURIComponent(
          name
        )
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        '조회에 실패했습니다.'
      );

    }


    renderResult(
      data
    );

  }catch(error){

    $('#error').textContent =
      error.message;

  }finally{

    button.disabled = false;

    button.textContent =
      '검색';

  }

}


/* =========================
   결과 렌더링
========================= */

function renderResult(
  data
){

  $('#home').style.display =
    'none';

  $('#result').style.display =
    'block';


  const typeLabel =
    data.type === 'booker'
      ? '예매자'
      : '배우';


  $('#resultName').textContent =
    data.name +
    ' · ' +
    typeLabel +
    ' 검색 결과';


  $('#summary').innerHTML =

    '<strong>' +
    data.totalPeople +
    '명</strong><br>' +

    data.totalBookings +
    '건';


  const days =
    new Map();


  for(
    const reservation
    of data.reservations
  ){

    for(
      const slot
      of reservation.slots
    ){

      const dayKey =
        slot.month +
        '-' +
        slot.day;


      if(
        !days.has(
          dayKey
        )
      ){

        days.set(
          dayKey,
          {

            month:
              slot.month,

            day:
              slot.day,

            times:
              new Map()

          }
        );

      }


      const day =
        days.get(
          dayKey
        );


      if(
        !day.times.has(
          slot.key
        )
      ){

        day.times.set(
          slot.key,
          {

            label:
              slot.label,

            minutes:
              slot.hour * 60 +
              slot.minute,

            rows:[]

          }
        );

      }


      const time =
        day.times.get(
          slot.key
        );


      if(
        !time.rows.some(
          row =>
            row.id ===
            reservation.id
        )
      ){

        time.rows.push(
          reservation
        );

      }

    }

  }


  let html = '';


  for(
    const day
    of [...days.values()]
      .sort(
        (a,b) =>
          a.month - b.month ||
          a.day - b.day
      )
  ){

    html += `

      <section class="day">

        <h2>
          ${day.month}월
          ${day.day}일
        </h2>

    `;


    for(
      const time
      of [...day.times.values()]
        .sort(
          (a,b) =>
            a.minutes -
            b.minutes
        )
    ){

      const people =
        time.rows.reduce(
          (sum,row) =>
            sum + row.count,
          0
        );


      html += `

        <div class="time">

          <div class="timeHead">

            <span class="timeLabel">
              ${esc(
                time.label
              )}
            </span>

            <span class="timeMeta">
              ${time.rows.length}건
              ·
              ${people}명
            </span>

          </div>

          ${time.rows
            .map(
              row => `

                <div class="person">

                  <span class="personName">
                    ${esc(row.name)}
                  </span>

                  <span class="personCount">
                    ${row.count}명
                  </span>

                </div>

              `
            )
            .join('')}

        </div>

      `;

    }


    html +=
      '</section>';

  }


  $('#groups').innerHTML =
    html ||
    `

      <div class="empty">

        해당 검색 결과가 없습니다.

      </div>

    `;


  $('#resultUpdated').textContent =
    '엑셀 마지막 응답 · ' +
    fmt(
      data.latestResponse
    ) +
    ' (KST)';

}


/* =========================
   공연 비교
========================= */

async function comparePerformances(){

  const box =
    $('#compareBox');

  const button =
    $('#compareBtn');

  button.disabled = true;


  try{

    const response =
      await fetch(
        '/api/compare-performances'
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        '집계에 실패했습니다.'
      );

    }


    const lunchNames =
      data.lunch.names
        .map(
          p =>
            esc(p.name) +
            ' ' +
            p.count +
            '명'
        )
        .join(', ') ||
      '없음';


    const dinnerNames =
      data.dinner.names
        .map(
          p =>
            esc(p.name) +
            ' ' +
            p.count +
            '명'
        )
        .join(', ') ||
      '없음';


    const both =
      data.both
        .map(
          name =>
            esc(name)
        )
        .join(', ') ||
      '없음';


    box.innerHTML = `

      <div class="cardHeading">

        <div class="cardTitle">
          점심 · 저녁 공연 비교
        </div>

        <div class="cardSub">
          지정 20명 기준
        </div>

      </div>


      <div class="compareGrid">

        <div class="compareSide">

          <b>
            정우영 · 점심 3회
          </b>

          <div class="compareNum">
            ${data.lunch.people}명
          </div>

          <div class="compareNames">
            ${lunchNames}
          </div>

        </div>


        <div class="compareSide">

          <b>
            김명훈 · 저녁 3회
          </b>

          <div class="compareNum">
            ${data.dinner.people}명
          </div>

          <div class="compareNames">
            ${dinnerNames}
          </div>

        </div>

      </div>


      <div class="compareBoth">

        <strong>
          점심 + 저녁 모두 예매
        </strong>

        <br>

        ${both}

      </div>


      <div class="compareNote">

        지인 선택 값은 사용하지 않고
        실제 예매 일자와 시간으로 분류합니다.

      </div>

    `;


    box.style.display =
      'block';


    button.style.display =
      'none';


    $('#compareCloseBtn')
      .style.display =
      'flex';

  }catch(error){

    box.innerHTML =
      '<div class="empty">' +
      esc(error.message) +
      '</div>';

    box.style.display =
      'block';

  }finally{

    button.disabled = false;

  }

}


/* =========================
   검색 버튼
========================= */

$('#searchBtn')
  .addEventListener(
    'click',
    () => search()
  );


$('#nameInput')
  .addEventListener(
    'keydown',
    event => {

      if(
        event.key === 'Enter'
      ){

        search();

      }

    }
  );


/* =========================
   빠른 검색
========================= */

document
  .querySelectorAll(
    '.quickBtn'
  )
  .forEach(button => {

    button.addEventListener(
      'click',
      () => {

        const name =
          button.dataset.name;

        search(name);

      }
    );

  });


/* =========================
   비교 버튼
========================= */

$('#compareBtn')
  .addEventListener(
    'click',
    comparePerformances
  );


$('#compareCloseBtn')
  .addEventListener(
    'click',
    () => {

      $('#compareBox')
        .style.display =
        'none';

      $('#compareBtn')
        .style.display =
        'flex';

      $('#compareCloseBtn')
        .style.display =
        'none';

    }
  );


/* =========================
   뒤로가기
========================= */

$('#backBtn')
  .addEventListener(
    'click',
    () => {

      $('#result')
        .style.display =
        'none';

      $('#home')
        .style.display =
        'block';

      $('#nameInput')
        .focus();

    }
  );


/* =========================
   시작
========================= */

loadStatus();

</script>

</body>

</html>
