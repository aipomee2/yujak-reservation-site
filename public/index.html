<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f1ec"><title>유작 · 예매 현황</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Pretendard:wght@400;500;600;700;800&display=swap');
:root{--bg:#f3f0eb;--paper:#fffdf9;--ink:#27231f;--muted:#817b73;--line:#e5e0d8;--soft:#f7f4ef;--shadow:0 18px 55px rgba(37,31,25,.08)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}.wrap{width:min(920px,calc(100% - 24px));margin:auto;padding:18px 0 60px}.topbar{display:flex;justify-content:space-between;align-items:center;padding:0 3px 14px;color:#77716a;font-size:10px}.brand{font:600 22px/1 "Noto Serif KR",serif;letter-spacing:-.13em}.date{letter-spacing:.08em}.poster{overflow:hidden;border-radius:26px;background:#eeeae4;box-shadow:var(--shadow);margin-bottom:16px}.poster img{display:block;width:100%;height:auto}.card{background:rgba(255,253,249,.97);border:1px solid rgba(50,45,40,.07);border-radius:24px;box-shadow:var(--shadow)}.search{padding:24px}.eyebrow{font-size:9px;font-weight:800;letter-spacing:.2em;color:#9a938b}.title{font:600 24px/1.35 "Noto Serif KR",serif;letter-spacing:-.07em;margin:7px 0 6px}.desc{font-size:11px;color:var(--muted);line-height:1.7;margin-bottom:15px}.row{display:flex;gap:8px}.input{height:52px;flex:1;min-width:0;border:1px solid #ddd7cf;border-radius:15px;padding:0 16px;background:#fbf9f5;outline:0;font-size:14px}.input:focus{background:#fff;border-color:#9b9389;box-shadow:0 0 0 4px #f0ece6}.btn{height:52px;border:0;border-radius:15px;background:#292724;color:#fff;font-size:12px;font-weight:800;padding:0 23px;cursor:pointer}.btn:disabled{opacity:.5}.meta{margin-top:8px;color:#aaa39b;font-size:9px}.error{min-height:16px;color:#a33a32;font-size:10px;margin-top:6px}.privacy{text-align:center;color:#9a938b;font-size:9px;line-height:1.7;margin:11px 5px}.episodeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.episode{padding:15px 16px}.episodeTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.episodeNo{font-size:9px;font-weight:800;letter-spacing:.12em;color:#9a938b}.episodePeople{font:600 22px "Noto Serif KR",serif}.episodePeople small{font:11px Pretendard,sans-serif;color:#77716a}.episodeDate{font-size:9px;color:#77716a}.episodeBookings{font-size:9px;color:#aaa39b;margin-top:4px}.stats{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px;margin-top:14px}.stat{padding:18px}.label{font-size:9px;color:#8b847c;margin-bottom:6px}.value{font:600 23px "Noto Serif KR",serif}.value small{font:11px Pretendard,sans-serif;color:#77716a}.update{font-size:10px;color:#77716a;line-height:1.6}.update strong{display:block;color:var(--ink);font-size:11px}.result{margin-top:22px;padding:22px}.resultTop{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding:0 2px 16px}.resultName{font:600 22px "Noto Serif KR",serif;letter-spacing:-.06em}.summary{text-align:right;font-size:10px;color:#77716a;line-height:1.6}.summary strong{font:600 19px "Noto Serif KR",serif;color:var(--ink)}.day{padding-top:20px}.day h2{font:600 16px "Noto Serif KR",serif;margin:0 0 9px}.time{overflow:hidden;border:1px solid var(--line);border-radius:17px;background:#fff;margin:8px 0}.timeHead{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;background:var(--soft);border-bottom:1px solid var(--line)}.timeLabel{font-weight:800;font-size:13px}.timeMeta{font-size:9px;color:#858079}.person{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;border-bottom:1px solid #f0ede8}.person:last-child{border-bottom:0}.personName{font-size:12px;font-weight:700}.personCount{font-size:10px;color:#77716b}.empty{text-align:center;padding:46px 10px;color:#777;font-size:12px}.back{border:0;background:transparent;color:#777;font-size:11px;font-weight:800;padding:0;margin:0 0 13px;cursor:pointer}footer{text-align:center;color:#aaa39b;font-size:9px;margin-top:18px}
@media(max-width:650px){.wrap{width:calc(100% - 14px);padding-top:10px}.topbar{padding-bottom:10px}.poster{border-radius:20px}.search{padding:19px}.title{font-size:21px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.stat{padding:15px}.value{font-size:21px}.result{padding:17px 13px;border-radius:21px}.resultTop{align-items:flex-start;flex-direction:column;gap:5px}.summary{text-align:left}.row .btn{padding:0 18px}.episodeGrid{grid-template-columns:1fr 1fr}.episode{padding:14px}}

/* episode cards */
.episodes{margin-top:14px;padding:18px}.episodesHead{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}.episodesTitle{font:600 16px "Noto Serif KR",serif;letter-spacing:-.05em}.episodesSub{font-size:9px;color:#9a938b}.episodeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.episode{position:relative;overflow:hidden;padding:15px 14px 14px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#fffdf9,#f7f3ed)}.episodeNo{font-size:9px;font-weight:800;letter-spacing:.12em;color:#9a938b}.episodePeople{margin-top:5px;font:600 22px "Noto Serif KR",serif;letter-spacing:-.05em}.episodePeople small{font:500 10px Pretendard,sans-serif;color:#77716a}.episodeMeta{margin-top:5px;font-size:9px;color:#9a938b}.episode::after{content:"";position:absolute;right:-18px;bottom:-22px;width:58px;height:58px;border-radius:50%;background:#eee8df;opacity:.7}.episode:nth-child(2)::after{background:#e9e2d8}.episode:nth-child(3)::after{background:#f0e9e0}.episode:nth-child(4)::after{background:#e9e5df}.episode:nth-child(5)::after{background:#eee6dc}.episode:nth-child(6)::after{background:#e8e2da}
@media(max-width:650px){.episodeGrid{grid-template-columns:repeat(2,1fr)}.episodes{padding:15px}.episode{padding:13px}.episodePeople{font-size:20px}}
</style>
</head>
<body><main class="wrap"><div class="topbar"><div class="brand">유작</div><div class="date">2026 · RESERVATION</div></div><div class="poster"><img src="/poster.png" alt="유작 공연 포스터"></div><section id="home"><div class="card search"><div class="eyebrow">RESERVATION CHECK</div><h1 class="title">배우 이름을 입력하세요</h1><div class="desc">배우 이름을 입력하면 해당 배우의 예매 현황을 날짜와 시간별로 확인할 수 있습니다.</div><div class="row"><input id="nameInput" class="input" placeholder="배우 이름을 입력하세요" autocomplete="off" maxlength="50"><button id="searchBtn" class="btn">확인</button></div><div id="status" class="meta">엑셀 데이터 확인 중…</div><div id="error" class="error"></div></div><div class="privacy">예매자 성함은 그대로 표시되며, 연락처는 공개하지 않습니다.</div><div class="stats"><div class="card stat"><div class="label">전체 예매 건수</div><div id="allBookings" class="value">— <small>건</small></div></div><div class="card stat"><div class="label">전체 예매 인원</div><div id="allPeople" class="value">— <small>명</small></div></div><div class="card stat"><div class="label">데이터 기준</div><div class="update"><strong id="allUpdated">확인 중…</strong>엑셀 마지막 응답 기준</div></div></div><div id="episodes" class="episodeGrid"></div></section><section id="result" style="display:none"><button id="backBtn" class="back">← 다시 검색</button><div class="card result"><div class="resultTop"><div id="resultName" class="resultName"></div><div id="summary" class="summary"></div></div><div id="groups"></div></div><footer id="resultUpdated"></footer></section></main>
<script>
const $=s=>document.querySelector(s);const fmt=s=>{if(!s)return '-';const d=new Date(s);if(Number.isNaN(d.getTime()))return s;return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Seoul'}).format(d)};const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function status(){try{const r=await fetch('/api/status');const d=await r.json();if(!r.ok)throw Error(d.error);$('#allBookings').innerHTML=d.reservationCount+' <small>건</small>';$('#allPeople').innerHTML=d.totalPeople+' <small>명</small>';$('#allUpdated').textContent=fmt(d.latestResponse);$('#status').textContent='엑셀 마지막 응답: '+fmt(d.latestResponse)+' (KST)';const eps=d.episodes||[];$('#episodeGrid').innerHTML=Array.from({length:6},(_,i)=>{const e=eps[i]||{episode:i+1,people:0,bookings:0,label:'회차 정보 없음'};return '<div class="episode"><div class="episodeNo">EPISODE '+String(e.episode).padStart(2,'0')+'</div><div class="episodePeople">'+e.people+' <small>명</small></div><div class="episodeMeta">'+(e.label||'')+' · '+e.bookings+'건</div></div>'}).join('');renderEpisodes(d.episodes||[]);}catch(e){$('#status').textContent='데이터를 불러오지 못했습니다.'}}

function renderEpisodes(episodes){
  const el=$('#episodes');
  if(!episodes.length){el.innerHTML='';return}
  el.innerHTML=episodes.slice(0,6).map(e=>'<div class="card episode"><div class="episodeTop"><span class="episodeNo">EPISODE '+e.episode+'</span><span class="episodeDate">'+esc(e.label)+'</span></div><div class="episodePeople">'+e.people+' <small>명</small></div><div class="episodeBookings">예매 '+e.bookings+'건</div></div>').join('');
}
async function search(){const name=$('#nameInput').value.trim();$('#error').textContent='';if(!name){$('#error').textContent='배우 이름을 입력해주세요.';return}const b=$('#searchBtn');b.disabled=true;b.textContent='조회 중';try{const r=await fetch('/api/search?name='+encodeURIComponent(name));const d=await r.json();if(!r.ok)throw Error(d.error||'조회에 실패했습니다.');render(d)}catch(e){$('#error').textContent=e.message}finally{b.disabled=false;b.textContent='확인'}}
function render(data){$('#home').style.display='none';$('#result').style.display='block';$('#resultName').textContent=data.name+'님 예매 현황';$('#summary').innerHTML='<strong>'+data.totalPeople+'명</strong><br>총 '+data.totalBookings+'건';const days=new Map();for(const r of data.reservations)for(const s of r.slots){const k=s.month+'-'+s.day;if(!days.has(k))days.set(k,{month:s.month,day:s.day,times:new Map()});const day=days.get(k);if(!day.times.has(s.key))day.times.set(s.key,{label:s.label,minutes:s.hour*60+s.minute,rows:[]});const t=day.times.get(s.key);if(!t.rows.some(x=>x.id===r.id))t.rows.push(r)}let html='';for(const day of [...days.values()].sort((a,b)=>a.month-b.month||a.day-b.day)){html+='<section class="day"><h2>'+day.month+'월 '+day.day+'일</h2>';for(const t of [...day.times.values()].sort((a,b)=>a.minutes-b.minutes)){const n=t.rows.reduce((s,r)=>s+r.count,0);html+='<div class="time"><div class="timeHead"><span class="timeLabel">'+esc(t.label)+'</span><span class="timeMeta">'+t.rows.length+'건 · '+n+'명</span></div>'+t.rows.map(r=>'<div class="person"><span class="personName">'+esc(r.name)+'</span><span class="personCount">'+r.count+'명</span></div>').join('')+'</div>'}html+='</section>'}$('#groups').innerHTML=html||'<div class="empty">해당 배우의 예매 내역이 없습니다.</div>';$('#resultUpdated').textContent='엑셀 마지막 응답 · '+fmt(data.latestResponse)+' (KST)'}
$('#searchBtn').onclick=search;$('#nameInput').onkeydown=e=>{if(e.key==='Enter')search()};$('#backBtn').onclick=()=>{$('#result').style.display='none';$('#home').style.display='block';$('#nameInput').focus()};status();
</script></body></html>
