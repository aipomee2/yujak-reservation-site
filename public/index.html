<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#f3f0eb">

<title>유작 · 예매 현황</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Pretendard:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#f3f0eb;
  --paper:#fffdf9;
  --ink:#27231f;
  --muted:#817b73;
  --line:#e5e0d8;
  --soft:#f7f4ef;
  --soft2:#eeeae3;
  --accent:#292724;
  --shadow:0 18px 55px rgba(37,31,25,.08);
}

*{
  box-sizing:border-box;
}

html{
  background:var(--bg);
}

body{
  margin:0;
  color:var(--ink);
  background:var(--bg);
  font-family:
    Pretendard,
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    sans-serif;

  -webkit-font-smoothing:antialiased;
}

button,
input{
  font-family:inherit;
}

.wrap{
  width:min(920px,calc(100% - 24px));
  margin:auto;
  padding:18px 0 60px;
}

/* =========================
   TOP
========================= */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:0 3px 14px;

  color:#77716a;
  font-size:10px;
}

.brand{
  font:
    600 22px/1
    "Noto Serif KR",
    serif;

  letter-spacing:-.13em;
}

.date{
  letter-spacing:.08em;
}

/* =========================
   POSTER
========================= */

.poster{
  overflow:hidden;

  border-radius:26px;

  background:#eeeae4;

  box-shadow:var(--shadow);

  margin-bottom:16px;
}

.poster img{
  display:block;

  width:100%;
  height:auto;
}

/* =========================
   CARD
========================= */

.card{
  background:rgba(255,253,249,.97);

  border:1px solid rgba(50,45,40,.07);

  border-radius:24px;

  box-shadow:var(--shadow);
}

/* =========================
   SEARCH
========================= */

.search{
  padding:24px;
}

.eyebrow{
  font-size:9px;
  font-weight:800;

  letter-spacing:.2em;

  color:#9a938b;
}

.title{
  font:
    600 24px/1.35
    "Noto Serif KR",
    serif;

  letter-spacing:-.07em;

  margin:7px 0 6px;
}

.desc{
  font-size:11px;

  color:var(--muted);

  line-height:1.7;

  margin-bottom:15px;
}

.row{
  display:flex;
  gap:8px;
}

.input{
  height:52px;

  flex:1;
  min-width:0;

  border:1px solid #ddd7cf;

  border-radius:15px;

  padding:0 16px;

  background:#fbf9f5;

  outline:0;

  font-size:14px;

  transition:.2s;
}

.input:focus{
  background:#fff;

  border-color:#9b9389;

  box-shadow:
    0 0 0 4px #f0ece6;
}

.btn{
  height:52px;

  border:0;

  border-radius:15px;

  background:var(--accent);

  color:#fff;

  font-size:12px;
  font-weight:800;

  padding:0 23px;

  cursor:pointer;

  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);

  opacity:.92;
}

.btn:disabled{
  opacity:.5;

  cursor:wait;

  transform:none;
}

.meta{
  margin-top:8px;

  color:#aaa39b;

  font-size:9px;
}

.error{
  min-height:16px;

  color:#a33a32;

  font-size:10px;

  margin-top:6px;
}

.privacy{
  text-align:center;

  color:#9a938b;

  font-size:9px;

  line-height:1.7;

  margin:11px 5px;
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;

  grid-template-columns:
    1fr 1fr 1.4fr;

  gap:10px;

  margin-top:14px;
}

.stat{
  padding:18px;
}

.label{
  font-size:9px;

  color:#8b847c;

  margin-bottom:6px;
}

.value{
  font:
    600 23px
    "Noto Serif KR",
    serif;
}

.value small{
  font:
    11px
    Pretendard,
    sans-serif;

  color:#77716a;
}

.update{
  font-size:10px;

  color:#77716a;

  line-height:1.6;
}

.update strong{
  display:block;

  color:var(--ink);

  font-size:11px;
}

/* =========================
   EPISODES
========================= */

.episodeSection{
  margin-top:14px;

  padding:22px;

  background:rgba(255,253,249,.97);

  border:
    1px solid
    rgba(50,45,40,.07);

  border-radius:24px;

  box-shadow:var(--shadow);
}

.episodeHeader{
  display:flex;

  justify-content:space-between;

  align-items:flex-end;

  margin-bottom:16px;
}

.episodeTitle{
  font:
    600 20px
    "Noto Serif KR",
    serif;

  letter-spacing:-.06em;

  margin:7px 0 0;
}

.episodeTotal{
  font-size:10px;

  color:#8b847c;
}

.episodes{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;
}

.episodeCard{
  position:relative;

  overflow:hidden;

  border:
    1px solid
    var(--line);

  border-radius:18px;

  padding:17px;

  background:#fff;

  transition:
    transform .2s,
    box-shadow .2s;
}

.episodeCard:hover{
  transform:translateY(-2px);

  box-shadow:
    0 10px 30px
    rgba(37,31,25,.07);
}

.episodeNumber{
  font-size:9px;

  font-weight:800;

  letter-spacing:.14em;

  color:#9a938b;

  margin-bottom:7px;
}

.episodeDate{
  font:
    600 15px
    "Noto Serif KR",
    serif;

  letter-spacing:-.04em;

  margin-bottom:12px;
}

.episodePeople{
  font:
    600 25px
    "Noto Serif KR",
    serif;
}

.episodePeople small{
  font:
    11px
    Pretendard,
    sans-serif;

  color:#77716a;
}

.episodeBookings{
  margin-top:4px;

  font-size:9px;

  color:#99928a;
}

.episodeRatio{
  margin-top:12px;

  height:4px;

  overflow:hidden;

  border-radius:99px;

  background:#eeeae4;
}

.episodeRatio span{
  display:block;

  height:100%;

  width:0%;

  border-radius:99px;

  background:#292724;
}

.episodeEmpty{
  opacity:.55;
}

.episodeEmpty .episodePeople{
  color:#aaa39b;
}

/* =========================
   REFRESH
========================= */

.refreshRow{
  display:flex;

  justify-content:flex-end;

  margin-top:10px;
}

.refreshBtn{
  border:0;

  background:transparent;

  color:#8b847c;

  font-size:9px;

  cursor:pointer;

  padding:5px 2px;
}

.refreshBtn:hover{
  color:var(--ink);
}

/* =========================
   SEARCH RESULT
========================= */

.result{
  margin-top:22px;

  padding:22px;
}

.resultTop{
  display:flex;

  justify-content:space-between;

  align-items:end;

  border-bottom:
    1px solid
    var(--line);

  padding:0 2px 16px;
}

.resultName{
  font:
    600 22px
    "Noto Serif KR",
    serif;

  letter-spacing:-.06em;
}

.summary{
  text-align:right;

  font-size:10px;

  color:#77716a;

  line-height:1.6;
}

.summary strong{
  font:
    600 19px
    "Noto Serif KR",
    serif;

  color:var(--ink);
}

.day{
  padding-top:20px;
}

.day h2{
  font:
    600 16px
    "Noto Serif KR",
    serif;

  margin:0 0 9px;
}

.time{
  overflow:hidden;

  border:
    1px solid
    var(--line);

  border-radius:17px;

  background:#fff;

  margin:8px 0;
}

.timeHead{
  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:13px 15px;

  background:var(--soft);

  border-bottom:
    1px solid
    var(--line);
}

.timeLabel{
  font-size:13px;

  font-weight:800;
}

.timeMeta{
  font-size:9px;

  color:#858079;
}

.person{
  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:12px 15px;

  border-bottom:
    1px solid #f0ede8;
}

.person:last-child{
  border-bottom:0;
}

.personName{
  font-size:12px;

  font-weight:700;
}

.personCount{
  font-size:10px;

  color:#77716b;
}

/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;

  padding:46px 10px;

  color:#777;

  font-size:12px;
}

/* =========================
   BACK
========================= */

.back{
  border:0;

  background:transparent;

  color:#777;

  font-size:11px;

  font-weight:800;

  padding:0;

  margin:0 0 13px;

  cursor:pointer;
}

/* =========================
   FOOTER
========================= */

footer{
  text-align:center;

  color:#aaa39b;

  font-size:9px;

  margin-top:18px;
}

/* =========================
   LOADING
========================= */

.loading{
  text-align:center;

  padding:30px 10px;

  color:#99928a;

  font-size:10px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){

  .wrap{
    width:calc(100% - 14px);

    padding-top:10px;
  }

  .topbar{
    padding-bottom:10px;
  }

  .poster{
    border-radius:20px;
  }

  .search{
    padding:19px;
  }

  .title{
    font-size:21px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .stat:last-child{
    grid-column:1/-1;
  }

  .stat{
    padding:15px;
  }

  .value{
    font-size:21px;
  }

  .episodeSection{
    padding:18px 15px;

    border-radius:21px;
  }

  .episodes{
    grid-template-columns:
      repeat(2,1fr);
  }

  .episodeCard{
    padding:14px;
  }

  .episodeDate{
    font-size:13px;
  }

  .episodePeople{
    font-size:21px;
  }

  .result{
    padding:17px 13px;

    border-radius:21px;
  }

  .resultTop{
    align-items:flex-start;

    flex-direction:column;

    gap:5px;
  }

  .summary{
    text-align:left;
  }

  .row .btn{
    padding:0 18px;
  }
}

@media(max-width:390px){

  .episodes{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<main class="wrap">

  <!-- 상단 -->
  <div class="topbar">
    <div class="brand">유작</div>
    <div class="date">2026 · RESERVATION</div>
  </div>


  <!-- 포스터 -->
  <div class="poster">
    <img
      src="/poster.png"
      alt="유작 공연 포스터"
    >
  </div>


  <!-- =========================
       HOME
  ========================== -->

  <section id="home">

    <!-- 검색 -->
    <div class="card search">

      <div class="eyebrow">
        RESERVATION CHECK
      </div>

      <h1 class="title">
        배우 이름을 입력하세요
      </h1>

      <div class="desc">
        배우 이름을 입력하면 해당 배우의
        예매 현황을 날짜와 시간별로 확인할 수 있습니다.
      </div>

      <div class="row">

        <input
          id="nameInput"
          class="input"
          placeholder="배우 이름을 입력하세요"
          autocomplete="off"
          maxlength="50"
        >

        <button
          id="searchBtn"
          class="btn"
        >
          확인
        </button>

      </div>

      <div
        id="status"
        class="meta"
      >
        엑셀 데이터 확인 중…
      </div>

      <div
        id="error"
        class="error"
      ></div>

    </div>


    <div class="privacy">
      예매자 성함은 그대로 표시되며,
      연락처는 공개하지 않습니다.
    </div>


    <!-- 전체 통계 -->
    <div class="stats">

      <div class="card stat">

        <div class="label">
          전체 예매 건수
        </div>

        <div
          id="allBookings"
          class="value"
        >
          — <small>건</small>
        </div>

      </div>


      <div class="card stat">

        <div class="label">
          전체 예매 인원
        </div>

        <div
          id="allPeople"
          class="value"
        >
          — <small>명</small>
        </div>

      </div>


      <div class="card stat">

        <div class="label">
          데이터 기준
        </div>

        <div class="update">

          <strong id="allUpdated">
            확인 중…
          </strong>

          엑셀 마지막 응답 기준

        </div>

      </div>

    </div>


    <!-- =========================
         회차별 현황
    ========================== -->

    <section class="episodeSection">

      <div class="episodeHeader">

        <div>

          <div class="eyebrow">
            EPISODE STATUS
          </div>

          <h2 class="episodeTitle">
            회차별 예매 현황
          </h2>

        </div>

        <div
          id="episodeTotal"
          class="episodeTotal"
        >
          총 6회
        </div>

      </div>


      <div
        id="episodes"
        class="episodes"
      >

        <div class="loading">
          회차별 데이터를 불러오는 중…
        </div>

      </div>


      <div class="refreshRow">

        <button
          id="refreshBtn"
          class="refreshBtn"
        >
          ↻ 데이터 새로고침
        </button>

      </div>

    </section>

  </section>


  <!-- =========================
       SEARCH RESULT
  ========================== -->

  <section
    id="result"
    style="display:none"
  >

    <button
      id="backBtn"
      class="back"
    >
      ← 다시 검색
    </button>


    <div class="card result">

      <div class="resultTop">

        <div
          id="resultName"
          class="resultName"
        ></div>

        <div
          id="summary"
          class="summary"
        ></div>

      </div>


      <div id="groups"></div>

    </div>


    <footer id="resultUpdated"></footer>

  </section>


</main>


<script>

/* =========================
   HELPERS
========================= */

const $ = selector =>
  document.querySelector(selector);


const fmt = value => {

  if(!value){
    return '-';
  }

  const d = new Date(value);

  if(Number.isNaN(d.getTime())){
    return value;
  }

  return new Intl.DateTimeFormat(
    'ko-KR',
    {
      year:'numeric',
      month:'numeric',
      day:'numeric',
      hour:'2-digit',
      minute:'2-digit',
      hour12:false,
      timeZone:'Asia/Seoul'
    }
  ).format(d);

};


const number = value =>
  Number(value || 0).toLocaleString('ko-KR');


const esc = value =>
  String(value ?? '').replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );


/* =========================
   회차 표시
========================= */

function renderEpisodes(episodes, totalPeople){

  const container =
    $('#episodes');

  if(!Array.isArray(episodes)){
    container.innerHTML =
      '<div class="empty">회차 데이터를 불러오지 못했습니다.</div>';

    return;
  }


  const list =
    Array.from(
      {length:6},
      (_,index) => episodes[index]
    );


  // 가장 많은 인원이 들어간 회차
  const maxPeople =
    Math.max(
      ...episodes.map(e =>
        Number(e.people || 0)
      ),
      1
    );


  container.innerHTML =
    list.map((episode,index) => {

      const episodeNumber =
        index + 1;


      // 아직 회차 데이터가 없는 경우
      if(!episode){

        return `

          <div class="episodeCard episodeEmpty">

            <div class="episodeNumber">
              EPISODE ${String(episodeNumber).padStart(2,'0')}
            </div>

            <div class="episodeDate">
              ${episodeNumber}회차
            </div>

            <div class="episodePeople">
              —
              <small>명</small>
            </div>

            <div class="episodeBookings">
              아직 예매 데이터 없음
            </div>

            <div class="episodeRatio">
              <span style="width:0%"></span>
            </div>

          </div>

        `;
      }


      const people =
        Number(episode.people || 0);

      const bookings =
        Number(episode.bookings || 0);


      const ratio =
        totalPeople > 0
          ? Math.min(
              100,
              (people / totalPeople) * 100
            )
          : 0;


      return `

        <div class="episodeCard">

          <div class="episodeNumber">
            EPISODE ${String(episodeNumber).padStart(2,'0')}
          </div>

          <div class="episodeDate">
            ${esc(episode.label)}
          </div>

          <div class="episodePeople">
            ${number(people)}
            <small>명</small>
          </div>

          <div class="episodeBookings">
            ${number(bookings)}건 예매
            · 전체의 ${ratio.toFixed(1)}%
          </div>

          <div class="episodeRatio">
            <span style="width:${Math.min(
              100,
              (people / maxPeople) * 100
            )}%"></span>
          </div>

        </div>

      `;

    })
    .join('');


  $('#episodeTotal').textContent =
    `총 ${episodes.length}회`;

}


/* =========================
   전체 상태
========================= */

async function status(){

  const refresh =
    $('#refreshBtn');

  if(refresh){

    refresh.disabled = true;

    refresh.textContent =
      '↻ 불러오는 중…';

  }


  try{

    const response =
      await fetch(
        '/api/status?_=' + Date.now()
      );


    const data =
      await response.json();


    if(!response.ok){

      throw Error(
        data.error ||
        '데이터를 불러오지 못했습니다.'
      );

    }


    /* 전체 통계 */

    $('#allBookings').innerHTML =
      number(data.reservationCount) +
      ' <small>건</small>';


    $('#allPeople').innerHTML =
      number(data.totalPeople) +
      ' <small>명</small>';


    $('#allUpdated').textContent =
      fmt(data.latestResponse);


    $('#status').textContent =
      '엑셀 마지막 응답: ' +
      fmt(data.latestResponse) +
      ' (KST)';


    /* 회차 */

    renderEpisodes(
      data.episodes,
      data.totalPeople
    );


  }catch(error){

    console.error(error);


    $('#status').textContent =
      '데이터를 불러오지 못했습니다.';


    $('#episodes').innerHTML = `

      <div class="empty">
        회차 데이터를 불러오지 못했습니다.<br>
        잠시 후 다시 시도해주세요.
      </div>

    `;

  }finally{

    if(refresh){

      refresh.disabled = false;

      refresh.textContent =
        '↻ 데이터 새로고침';

    }

  }

}


/* =========================
   검색
========================= */

async function search(){

  const name =
    $('#nameInput')
      .value
      .trim();


  $('#error').textContent = '';


  if(!name){

    $('#error').textContent =
      '배우 이름을 입력해주세요.';

    return;

  }


  const button =
    $('#searchBtn');


  button.disabled = true;

  button.textContent =
    '조회 중';


  try{

    const response =
      await fetch(
        '/api/search?name=' +
        encodeURIComponent(name) +
        '&_=' +
        Date.now()
      );


    const data =
      await response.json();


    if(!response.ok){

      throw Error(
        data.error ||
        '조회에 실패했습니다.'
      );

    }


    render(data);


  }catch(error){

    console.error(error);

    $('#error').textContent =
      error.message ||
      '조회에 실패했습니다.';

  }finally{

    button.disabled = false;

    button.textContent =
      '확인';

  }

}


/* =========================
   검색 결과
========================= */

function render(data){

  $('#home').style.display =
    'none';

  $('#result').style.display =
    'block';


  $('#resultName').textContent =
    data.name +
    '님 예매 현황';


  $('#summary').innerHTML =
    '<strong>' +
    number(data.totalPeople) +
    '명</strong><br>' +
    '총 ' +
    number(data.totalBookings) +
    '건';


  const days =
    new Map();


  for(const reservation of data.reservations){

    for(const slot of reservation.slots){

      const dayKey =
        slot.month +
        '-' +
        slot.day;


      if(!days.has(dayKey)){

        days.set(
          dayKey,
          {
            month:slot.month,
            day:slot.day,
            times:new Map()
          }
        );

      }


      const day =
        days.get(dayKey);


      if(!day.times.has(slot.key)){

        day.times.set(
          slot.key,
          {
            label:slot.label,

            minutes:
              slot.hour * 60 +
              slot.minute,

            rows:[]
          }
        );

      }


      const time =
        day.times.get(slot.key);


      if(
        !time.rows.some(
          row =>
            row.id === reservation.id
        )
      ){

        time.rows.push(
          reservation
        );

      }

    }

  }


  let html = '';


  const sortedDays =
    [...days.values()]
      .sort(
        (a,b) =>
          a.month - b.month ||
          a.day - b.day
      );


  for(const day of sortedDays){

    html +=
      '<section class="day">' +
      '<h2>' +
      day.month +
      '월 ' +
      day.day +
      '일' +
      '</h2>';


    const sortedTimes =
      [...day.times.values()]
        .sort(
          (a,b) =>
            a.minutes -
            b.minutes
        );


    for(const time of sortedTimes){

      const people =
        time.rows.reduce(
          (sum,row) =>
            sum +
            Number(row.count || 0),
          0
        );


      html += `

        <div class="time">

          <div class="timeHead">

            <span class="timeLabel">
              ${esc(time.label)}
            </span>

            <span class="timeMeta">
              ${number(time.rows.length)}건
              ·
              ${number(people)}명
            </span>

          </div>

          ${time.rows
            .map(row => `

              <div class="person">

                <span class="personName">
                  ${esc(row.name)}
                </span>

                <span class="personCount">
                  ${number(row.count)}명
                </span>

              </div>

            `)
            .join('')}

        </div>

      `;

    }


    html +=
      '</section>';

  }


  $('#groups').innerHTML =
    html ||
    '<div class="empty">해당 배우의 예매 내역이 없습니다.</div>';


  $('#resultUpdated').textContent =
    '엑셀 마지막 응답 · ' +
    fmt(data.latestResponse) +
    ' (KST)';

}


/* =========================
   EVENTS
========================= */

$('#searchBtn').onclick =
  search;


$('#nameInput').onkeydown =
  event => {

    if(event.key === 'Enter'){

      search();

    }

  };


$('#backBtn').onclick =
  () => {

    $('#result').style.display =
      'none';

    $('#home').style.display =
      'block';

    $('#nameInput').focus();

  };


$('#refreshBtn').onclick =
  status;


/* =========================
   INITIAL LOAD
========================= */

status();

</script>

</body>
</html>
