<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f0eb"><title>유작 · 예매 현황</title><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Pretendard:wght@400;500;600;700;800&display=swap');
:root{--bg:#f3f0eb;--paper:#fffdf9;--ink:#24211e;--muted:#817b73;--line:#e5e0d8;--soft:#f7f4ef;--shadow:0 20px 60px rgba(37,31,25,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}.wrap{width:min(940px,calc(100% - 28px));margin:auto;padding:22px 0 70px}.topbar{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 18px;color:#6e6861;font-size:11px}.brand{font-family:"Noto Serif KR",serif;font-size:22px;letter-spacing:-.12em}.toplinks{display:flex;gap:18px}.toplinks a{color:inherit;text-decoration:none}.poster{overflow:hidden;border-radius:28px;background:#eeeae4;box-shadow:var(--shadow);margin-bottom:18px}.poster img{display:block;width:100%;height:auto}.card{background:rgba(255,253,249,.97);border:1px solid rgba(50,45,40,.07);border-radius:24px;box-shadow:var(--shadow)}.search{display:grid;grid-template-columns:1fr 1.25fr;gap:24px;align-items:center;padding:27px 30px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.2em;color:#9a938b}.title{font-family:"Noto Serif KR",serif;font-size:25px;letter-spacing:-.07em;margin:7px 0}.desc{font-size:12px;color:var(--muted);line-height:1.7}.row{display:flex;gap:9px}.input{height:54px;flex:1;min-width:0;border:1px solid #ddd7cf;border-radius:16px;padding:0 17px;font-size:15px;background:#fbf9f5;outline:0}.input:focus{background:#fff;border-color:#9b9389;box-shadow:0 0 0 4px #f0ece6}.btn{height:54px;border:0;border-radius:16px;background:#272522;color:#fff;font-size:13px;font-weight:800;padding:0 24px;cursor:pointer}.btn:disabled{opacity:.5}.updated{font-size:10px;color:#aaa39a;margin-top:8px;text-align:right}.error{font-size:11px;color:#a33a32;min-height:16px;margin-top:7px}.privacy{text-align:center;color:#9a938b;font-size:10px;line-height:1.7;margin:12px 4px}.stats{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:12px;margin-top:16px}.stat{padding:20px 22px}.label{font-size:10px;color:#8b847c;margin-bottom:7px}.value{font-family:"Noto Serif KR",serif;font-size:25px;letter-spacing:-.05em}.value small{font-family:Pretendard,sans-serif;font-size:12px;color:#777}.update{font-size:11px;color:#77716a;line-height:1.65}.update strong{display:block;color:var(--ink);font-size:12px}.section{margin-top:24px;padding:24px}.result-top{display:flex;justify-content:space-between;align-items:end;padding:0 4px 17px;border-bottom:1px solid var(--line)}.result-name{font-family:"Noto Serif KR",serif;font-size:24px;letter-spacing:-.06em}.summary{text-align:right;color:#77716b;font-size:10px;line-height:1.7}.summary strong{color:var(--ink);font-family:"Noto Serif KR",serif;font-size:21px}.back{border:0;background:transparent;color:#777;padding:0;font-weight:800;font-size:12px;margin:2px 0 15px;cursor:pointer}.day{padding-top:22px}.day-title{font-family:"Noto Serif KR",serif;font-size:17px;margin:0 0 10px}.time{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#fff;margin:9px 0}.time-head{display:flex;justify-content:space-between;padding:14px 16px;background:var(--soft);border-bottom:1px solid var(--line)}.time-label{font-weight:800;font-size:14px}.time-meta{font-size:10px;color:#858079}.person{display:flex;justify-content:space-between;padding:13px 16px;border-bottom:1px solid #f0ede8}.person:last-child{border:0}.person-name{font-weight:700;font-size:13px}.person-count{font-size:11px;color:#77716b}.empty{text-align:center;padding:50px 16px;color:#777;font-size:13px}.admin{display:none}.adminbox{padding:24px}.adminbox p{font-size:12px;color:#777;line-height:1.6}.file{width:100%;margin:8px 0 10px}.msg{font-size:11px;min-height:20px;margin-top:10px}.home{display:block;text-align:center;margin-top:18px;color:#888;text-decoration:none;font-size:11px}@media(max-width:700px){.wrap{width:calc(100% - 18px);padding-top:12px}.poster{border-radius:22px}.search{grid-template-columns:1fr;padding:22px 19px;gap:16px}.title{font-size:22px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.stat{padding:17px 18px}.value{font-size:22px}.updated{text-align:left}.section{padding:19px 14px;border-radius:22px}.result-top{align-items:flex-start;flex-direction:column;gap:5px}.summary{text-align:left}.row .btn{padding:0 18px}}
</style></head><body><main class="wrap"><div class="topbar"><div class="brand">유작</div><div class="toplinks"><span>예매 현황</span><a href="#admin">관리자</a></div></div><section id="home"><div class="poster"><img src="/poster.png" alt="유작 공연 포스터"></div><div class="card search"><div><div class="eyebrow">RESERVATION CHECK</div><h1 class="title">배우 이름을 입력하세요</h1><div class="desc">공연에 참여한 배우 이름으로 예매 현황을 확인할 수 있습니다.</div></div><div><div class="row"><input id="name" class="input" placeholder="배우 이름을 입력하세요" maxlength="50"><button id="search" class="btn">확인</button></div><div id="updated" class="updated">마지막 업데이트: 확인 중…</div><div id="error" class="error"></div></div></div><div class="privacy">예매자 성함은 실제 예매 정보 그대로 표시됩니다.<br>연락처 등 개인정보는 이 페이지에 표시하지 않습니다.</div><div class="stats"><div class="card stat"><div class="label">전체 예매 건수</div><div id="bookings" class="value">— <small>건</small></div></div><div class="card stat"><div class="label">전체 예매 인원</div><div id="people" class="value">— <small>명</small></div></div><div class="card stat"><div class="label">마지막 업데이트</div><div class="update"><strong id="updated2">확인 중…</strong>엑셀 업로드 기준 · KST</div></div></div></section><section id="result" style="display:none"><button id="back" class="back">← 다시 검색</button><div class="card section"><div class="result-top"><div id="resultName" class="result-name"></div><div id="summary" class="summary"></div></div><div id="groups"></div></div></section><section id="admin" class="admin"><div class="card adminbox"><div class="eyebrow">ADMIN</div><h1 class="title">엑셀 업로드</h1><p>네이버폼에서 내려받은 엑셀을 업로드하면 공개 예매 현황이 새 데이터로 교체됩니다.</p><input id="pw" class="input" type="password" placeholder="관리자 비밀번호"><input id="file" class="file" type="file" accept=".xlsx,.xls"><button id="upload" class="btn" style="width:100%">엑셀 업로드 및 반영</button><div id="msg" class="msg"></div></div><a class="home" href="/">← 공개 페이지로</a></section></main><script>
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function fmt(x){if(!x)return '-';return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Seoul'}).format(new Date(x))}
async function status(){try{const d=await fetch('/api/status').then(r=>r.json());$('#updated').textContent='마지막 업데이트: '+fmt(d.updatedAt)+' (KST)';$('#bookings').innerHTML=d.reservationCount+' <small>건</small>';$('#people').innerHTML=d.totalPeople+' <small>명</small>';$('#updated2').textContent=fmt(d.updatedAt)+' (KST)'}catch{}}
async function search(){const q=$('#name').value.trim();$('#error').textContent='';if(!q){$('#error').textContent='배우 이름을 입력해주세요.';return}const b=$('#search');b.disabled=true;b.textContent='조회 중';try{const r=await fetch('/api/search?name='+encodeURIComponent(q));const d=await r.json();if(!r.ok)throw Error(d.error);render(d)}catch(e){$('#error').textContent=e.message}finally{b.disabled=false;b.textContent='확인'}}
function render(d){$('#home').style.display='none';$('#result').style.display='block';$('#resultName').textContent=d.name+'님 예매 현황';$('#summary').innerHTML='<strong>'+d.totalPeople+'명</strong><br>총 '+d.totalBookings+'건';const days=new Map();for(const r of d.reservations)for(const s of r.slots){const dk=s.month+'-'+s.day;if(!days.has(dk))days.set(dk,{month:s.month,day:s.day,times:new Map()});const day=days.get(dk);if(!day.times.has(s.key))day.times.set(s.key,{label:s.label,minutes:s.hour*60+s.minute,rows:[]});const t=day.times.get(s.key);if(!t.rows.some(x=>x.id===r.id))t.rows.push(r)}$('#groups').innerHTML=[...days.values()].sort((a,b)=>a.month-b.month||a.day-b.day).map(day=>'<section class="day"><h2 class="day-title">'+day.month+'월 '+day.day+'일</h2>'+[...day.times.values()].sort((a,b)=>a.minutes-b.minutes).map(t=>'<div class="time"><div class="time-head"><span class="time-label">'+esc(t.label)+'</span><span class="time-meta">'+t.rows.length+'건 · '+t.rows.reduce((s,r)=>s+r.count,0)+'명</span></div>'+t.rows.map(r=>'<div class="person"><span class="person-name">'+esc(r.name)+'</span><span class="person-count">'+r.count+'명</span></div>').join('')+'</div>').join('')+'</section>').join('')||'<div class="empty">등록된 예매 내역이 없습니다.</div>'}
$('#search').onclick=search;$('#name').onkeydown=e=>{if(e.key==='Enter')search()};$('#back').onclick=()=>{location.href='/'};$('#upload').onclick=async()=>{const pw=$('#pw').value,f=$('#file').files[0];if(!pw||!f){$('#msg').textContent='비밀번호와 엑셀 파일을 모두 입력해주세요.';return}const fd=new FormData();fd.append('file',f);const b=$('#upload');b.disabled=true;b.textContent='업로드 중…';try{const r=await fetch('/api/upload',{method:'POST',headers:{'x-admin-password':pw},body:fd});const d=await r.json();if(!r.ok)throw Error(d.error);$('#msg').textContent='반영 완료 · '+d.reservationCount+'건 · '+d.totalPeople+'명 · '+fmt(d.updatedAt)+' (KST)'}catch(e){$('#msg').textContent=e.message}finally{b.disabled=false;b.textContent='엑셀 업로드 및 반영'}};
function route(){const a=location.hash==='#admin';$('#admin').style.display=a?'block':'none';$('#home').style.display=a?'none':'block';$('#result').style.display='none'}addEventListener('hashchange',route);route();status();
</script></body></html>
