<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717"><meta name="description" content="유작 공연 지인별 예매 현황">
<title>유작 · 예매 현황</title>
<style>
:root{--bg:#f5f2ed;--card:#fff;--ink:#171717;--muted:#77736d;--line:#e8e3db;--soft:#f7f5f1;--accent:#171717;--danger:#b42318;--radius:22px}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}.wrap{width:min(720px,calc(100% - 28px));margin:auto;padding:28px 0 56px}.hero{padding:18px 3px 24px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:#9a958e}.title{font-size:34px;line-height:1.12;font-weight:900;letter-spacing:-.04em;margin:9px 0 10px}.desc{color:var(--muted);font-size:14px;line-height:1.7}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 36px rgba(28,24,18,.055)}.search{padding:18px}.search-row{display:flex;gap:9px}.input{height:52px;flex:1;min-width:0;border:1px solid #d9d3ca;border-radius:15px;padding:0 15px;font-size:16px;background:#fff;outline:0}.input:focus{border-color:#777;box-shadow:0 0 0 3px #eeeae3}.btn{height:52px;border:0;border-radius:15px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;padding:0 20px;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.updated{font-size:11px;color:#9a958e;margin:11px 2px 0}.error{font-size:13px;color:var(--danger);margin:11px 2px 0;min-height:18px}.admin-link{display:block;text-align:center;color:#aaa;text-decoration:none;font-size:11px;margin:22px 0}.back{border:0;background:transparent;color:#777;padding:0;font-weight:700;font-size:13px;margin:4px 0 18px;cursor:pointer}.result-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:4px 2px 20px}.result-name{font-size:23px;font-weight:900;letter-spacing:-.03em}.summary{white-space:nowrap;text-align:right;color:#5e5a55;font-size:12px;line-height:1.65}.summary strong{color:#171717;font-size:15px}.day{margin:26px 0}.day-title{font-size:19px;font-weight:900;letter-spacing:-.02em;margin:0 3px 10px}.time{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#fff;margin:9px 0}.time-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--soft);border-bottom:1px solid var(--line)}.time-label{font-size:17px;font-weight:900}.time-meta{font-size:12px;color:#777}.person{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #f0ece6}.person:last-child{border-bottom:0}.person-name{font-weight:700}.person-count{font-size:13px;color:#666}.empty{text-align:center;padding:42px 16px;color:#777;font-size:14px}.notice{padding:15px 16px;border-radius:16px;background:#fff8e8;border:1px solid #f1dfb7;color:#765a20;font-size:12px;line-height:1.6;margin-top:12px}footer{text-align:center;color:#aaa;font-size:10px;margin-top:34px}.admin{display:none}.admin-card{padding:18px}.admin-card h2{margin:0 0 7px;font-size:20px}.admin-card p{margin:0 0 16px;color:#777;font-size:13px;line-height:1.6}.file{width:100%;height:50px;border:1px dashed #ccc;border-radius:14px;padding:12px;background:#fff;margin:6px 0 10px}.upload-msg{min-height:20px;margin-top:11px;font-size:12px;color:#666}.back-home{display:block;text-align:center;margin-top:20px;color:#888;text-decoration:none;font-size:12px}@media(max-width:520px){.wrap{width:min(100% - 20px,720px);padding-top:18px}.title{font-size:30px}.result-top{align-items:flex-start;flex-direction:column;gap:5px}.summary{text-align:left}.search-row .btn{padding:0 17px}.time-head,.person{padding-left:14px;padding-right:14px}}
</style></head>
<body><main class="wrap">
<section id="home"><div class="hero"><div class="eyebrow">YU-JAK · RESERVATION</div><h1 class="title">공연 예매 현황</h1><div class="desc">예매할 때 등록한 <b>지인 이름</b>을 입력하면<br>해당 지인으로 연결된 예매 내역을 확인할 수 있어요.</div></div>
<div class="card search"><div class="search-row"><input id="nameInput" class="input" placeholder="지인 이름을 입력해주세요" autocomplete="off" maxlength="50"><button id="searchBtn" class="btn">확인</button></div><div id="status" class="updated">마지막 업데이트: 확인 중…</div><div id="error" class="error"></div></div><div class="notice">예매자 성함은 실제 예매 정보 그대로 표시됩니다. 연락처 등 개인정보는 이 페이지에 표시하지 않습니다.</div><a class="admin-link" href="#admin">관리자</a></section>
<section id="result" style="display:none"><button id="backBtn" class="back">← 다시 검색</button><div class="result-top"><div id="resultName" class="result-name"></div><div id="summary" class="summary"></div></div><div id="groups"></div><footer id="resultUpdated"></footer></section>
<section id="admin" class="admin"><div class="hero"><div class="eyebrow">ADMIN</div><h1 class="title">엑셀 업로드</h1><div class="desc">네이버폼에서 내려받은 엑셀을 업로드하면 공개 예매 현황이 새 데이터로 교체됩니다.</div></div><div class="card admin-card"><input id="password" class="input" type="password" placeholder="관리자 비밀번호" autocomplete="current-password"><input id="file" class="file" type="file" accept=".xlsx,.xls"><button id="uploadBtn" class="btn" style="width:100%">엑셀 업로드 및 반영</button><div id="uploadMsg" class="upload-msg"></div></div><a class="back-home" href="/">← 공개 페이지로</a></section>
</main><script>
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function fmt(iso){if(!iso)return'-';return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Seoul'}).format(new Date(iso))}
function setError(s=''){ $('#error').textContent=s }
async function status(){try{const r=await fetch('/api/status');const d=await r.json();$('#status').textContent='마지막 업데이트: '+fmt(d.updatedAt)+' (KST)'}catch{$('#status').textContent='마지막 업데이트 시간을 불러오지 못했습니다.'}}
function render(data){
 $('#home').style.display='none';$('#result').style.display='block';$('#resultName').textContent=data.name+'님 예매 현황';$('#summary').innerHTML=`<strong>${data.totalPeople}명</strong><br>총 ${data.totalBookings}건`;
 const days=new Map();
 for(const r of data.reservations){for(const slot of r.slots){const dk=`${slot.month}-${slot.day}`;if(!days.has(dk))days.set(dk,{month:slot.month,day:slot.day,times:new Map()});const day=days.get(dk);if(!day.times.has(slot.key))day.times.set(slot.key,{label:slot.label,rows:[]});const t=day.times.get(slot.key);if(!t.rows.some(x=>x.id===r.id))t.rows.push(r)}}
 const html=[...days.values()].sort((a,b)=>a.month-b.month||a.day-b.day).map(day=>{const times=[...day.times.values()].sort((a,b)=>a.rows[0].slots.find(s=>s.label===a.label).key.localeCompare(b.rows[0].slots.find(s=>s.label===b.label).key));return `<section class="day"><h2 class="day-title">📅 ${day.month}월 ${day.day}일</h2>${times.map(t=>{const n=t.rows.reduce((s,r)=>s+r.count,0);return `<div class="time"><div class="time-head"><span class="time-label">${esc(t.label)}</span><span class="time-meta">${t.rows.length}건 · ${n}명</span></div>${t.rows.map(r=>`<div class="person"><span class="person-name">${esc(r.name)}</span><span class="person-count">${r.count}명</span></div>`).join('')}</div>`}).join('')}</section>`}).join('');
 $('#groups').innerHTML=html||'<div class="card empty">등록된 예매 내역이 없습니다.</div>';$('#resultUpdated').textContent='마지막 업데이트 · '+fmt(data.updatedAt)+' (KST)';
}
async function search(){const name=$('#nameInput').value.trim();setError();if(!name){setError('이름을 입력해주세요.');return}const b=$('#searchBtn');b.disabled=true;b.textContent='조회 중';try{const r=await fetch('/api/search?name='+encodeURIComponent(name));const d=await r.json();if(!r.ok)throw new Error(d.error||'조회에 실패했습니다.');render(d)}catch(e){setError(e.message)}finally{b.disabled=false;b.textContent='확인'}}
$('#searchBtn').onclick=search;$('#nameInput').onkeydown=e=>{if(e.key==='Enter')search()};$('#backBtn').onclick=()=>{location.hash='';$('#result').style.display='none';$('#home').style.display='block';$('#nameInput').focus();status()};
$('#uploadBtn').onclick=async()=>{const pw=$('#password').value,file=$('#file').files[0],m=$('#uploadMsg');m.textContent='';if(!pw||!file){m.textContent='비밀번호와 엑셀 파일을 모두 입력해주세요.';return}const fd=new FormData();fd.append('file',file);const b=$('#uploadBtn');b.disabled=true;b.textContent='업로드 중…';try{const r=await fetch('/api/upload',{method:'POST',headers:{'x-admin-password':pw},body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||'업로드 실패');m.textContent=`반영 완료 · ${d.reservationCount}건 · ${fmt(d.updatedAt)} (KST)`}catch(e){m.textContent=e.message}finally{b.disabled=false;b.textContent='엑셀 업로드 및 반영'}};
function route(){const admin=location.hash==='#admin';$('#admin').style.display=admin?'block':'none';$('#home').style.display=admin?'none':($('#result').style.display==='block'?'none':'block');if(admin)$('#result').style.display='none'}window.addEventListener('hashchange',route);route();status();
</script></body></html>
